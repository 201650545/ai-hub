<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>词境挖空 · 主动输出训练器</title>
<link rel="stylesheet" href="/static/theme.css">
<style>
  /* tokens 复用 /static/theme.css；此处只放页面专属样式 */
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--text-primary);
       font-family:var(--font-sans); min-height:100vh; -webkit-font-smoothing:antialiased;}
  .wrap{max-width:820px; margin:0 auto; padding:24px 16px 64px;}

  header{display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; padding:8px 4px 20px;
         border-bottom:1px solid var(--line); margin-bottom:24px;}
  .logo{font-size:21px; font-weight:700; letter-spacing:-.01em; color:var(--text-primary);}
  .logo small{font-size:12px; font-weight:400; color:var(--text-secondary); margin-left:8px;}
  .badge{font-size:11px; color:var(--accent); background:var(--accent-subtle); border-radius:99px;
         padding:3px 10px; letter-spacing:.06em; font-weight:500;}
  .spacer{flex:1;}
  .hbtn{font-size:13px; border:1px solid var(--line); background:var(--bg); color:var(--text-primary);
        border-radius:99px; padding:6px 14px; cursor:pointer; font-family:inherit; transition:all .15s var(--ease);}
  .hbtn:hover{border-color:var(--line-strong); background:var(--bg-subtle);}
  .progress{font-size:12px; color:var(--text-secondary); display:flex; align-items:center; gap:8px;}
  .progress b{color:var(--text-primary);}

  /* ---------- 控制区 ---------- */
  .ctl{background:var(--bg-elevated); border:1px solid var(--line); border-radius:var(--radius-lg);
       padding:20px 22px; margin-bottom:16px; box-shadow:var(--shadow-sm);}
  .ctl .row{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:12px;}
  .ctl .row:last-child{margin-bottom:0;}
  .ctl label{font-size:12.5px; color:var(--text-secondary);}
  .ctl input[type=text], .ctl textarea{flex:1; min-width:200px; border:1px solid var(--line); border-radius:var(--radius-md);
        padding:10px 12px; font-size:13.5px; font-family:inherit; background:var(--bg); color:var(--text-primary);
        outline:none; transition:border-color .15s var(--ease), box-shadow .15s var(--ease);}
  .ctl input[type=text]:focus, .ctl textarea:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-subtle);}
  .ctl textarea{width:100%; min-height:80px; resize:vertical;}
  .ctl select, .ctl input[type=range]{border:1px solid var(--line); border-radius:var(--radius-md); padding:8px 10px;
        font-size:13px; background:var(--bg); color:var(--text-primary); font-family:inherit;}
  .btn{font-size:13px; border:none; border-radius:99px; padding:9px 18px; cursor:pointer; font-family:inherit;
       font-weight:500; transition:all .15s var(--ease);}
  .btn-acc{background:var(--accent); color:#fff;} .btn-acc:hover{background:var(--accent-hover);}
  .btn-sage{background:var(--accent); color:#fff;} .btn-sage:hover{background:var(--accent-hover);}
  .btn-line{border:1px solid var(--line); background:var(--bg); color:var(--text-primary);}
  .btn-line:hover{border-color:var(--line-strong); background:var(--bg-subtle);}
  .btn:disabled{opacity:.5; cursor:not-allowed;}
  .btn:active{transform:scale(.98);}

  /* ---------- AI 候选卡片 ---------- */
  .cand{display:block; width:100%; text-align:left; background:var(--bg); border:1px solid var(--line); border-radius:var(--radius-md);
        padding:13px 15px; margin-bottom:10px; cursor:pointer; font-family:inherit; transition:all .15s var(--ease);}
  .cand:hover{border-color:var(--accent); box-shadow:0 2px 10px rgba(0,113,227,.10);}
  .cand .ct{font-size:14px; font-weight:600; color:var(--text-primary); margin-bottom:4px;}
  .cand .cp{font-size:12px; color:var(--text-secondary); line-height:1.5;}

  /* ---------- 文章 ---------- */
  article{background:var(--bg-elevated); border:1px solid var(--line); border-radius:var(--radius-lg);
          padding:36px 40px 28px; box-shadow:var(--shadow-sm);}
  .story-title{font-size:24px; font-weight:700; letter-spacing:-.01em; margin-bottom:4px; color:var(--text-primary);}
  .story-meta{font-size:12.5px; color:var(--text-secondary); margin-bottom:20px; padding-bottom:16px; border-bottom:1px solid var(--line);}
  .story{font-size:17px; line-height:2.0; text-align:justify; color:var(--text-primary);}
  /* 挖空输入：保留下划线交互（产品特色），颜色统一 accent */
  .blank{display:inline-block; width:110px; border:none; border-bottom:2px solid var(--line-strong);
         background:transparent; font-size:16px; padding:2px 6px; margin:0 2px; text-align:center; color:var(--text-primary);
         font-family:inherit; outline:none; transition:all .2s var(--ease);}
  .blank:focus{border-bottom-color:var(--accent); background:var(--accent-subtle);}
  .blank.ok{border-bottom-color:var(--success); color:var(--success); background:rgba(52,199,89,.10);}
  .blank.err{border-bottom-color:var(--danger); color:var(--danger); background:rgba(255,59,48,.08);}
  .blank.show{border-bottom-color:var(--danger); color:var(--danger);}

  /* ---------- 底部控制 ---------- */
  .foot{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-top:20px; padding-top:18px; border-top:1px solid var(--line);}
  .stat{font-size:13px; color:var(--text-secondary);}
  .stat b{color:var(--text-primary); font-weight:700;}
  .stat .ok{color:var(--success);} .stat .err{color:var(--danger);}

  /* ---------- 错题本 ---------- */
  .wrongbox{margin-top:18px; background:var(--bg-subtle); border:1px solid var(--line); border-radius:var(--radius-lg); padding:16px 18px; display:none;}
  .wrongbox.show{display:block;}
  .wrongbox h4{font-size:12px; color:var(--text-secondary); margin-bottom:10px; letter-spacing:.06em; text-transform:uppercase; font-weight:600;}
  .w-item{display:inline-block; background:var(--bg); border:1px solid var(--line); border-radius:var(--radius-sm); padding:6px 11px; margin:3px 4px 3px 0; font-size:13px; color:var(--text-primary);}
  .w-item .ans{color:var(--danger); font-weight:600;}

  .note{font-size:12px; color:var(--text-secondary); background:var(--bg-subtle); border-radius:var(--radius-sm); padding:10px 12px; margin-top:12px; line-height:1.6;}
  .loading{display:flex; align-items:center; gap:8px; color:var(--text-secondary); font-size:13px; padding:8px 0;}
  .loading .dot{width:6px; height:6px; border-radius:50%; background:var(--accent); animation:blink 1s infinite;}
  .loading .dot:nth-child(2){animation-delay:.2s;} .loading .dot:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,100%{opacity:.2;}50%{opacity:1;}}

  footer{text-align:center; color:var(--text-tertiary); font-size:12px; margin-top:28px;}
  @media (max-width:600px){ article{padding:24px 18px;} .story{font-size:16px;} .blank{width:80px;} }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="logo">词境挖空<small>主动输出训练器</small></div>
    <span class="badge">AI 内容供给 · 本地网关</span>
    <div class="spacer"></div>
    <div class="progress">本轮 <b id="pgDone">0</b>/<span id="pgTotal">0</span></div>
    <button class="hbtn" id="btnBook">错题本 <span id="bookCnt">(0)</span></button>
  </header>

  <div class="ctl">
    <div class="row">
      <label>内容来源：</label>
      <button class="btn btn-line" id="btnDemo">内置示例</button>
      <button class="btn btn-line" id="btnPaste">粘贴文本</button>
      <button class="btn btn-acc" id="btnAI">✨ AI 一句话找内容</button>
      <label style="margin-left:auto;">挖空密度</label>
      <select id="density">
        <option value="0.1">稀（10%）</option>
        <option value="0.2" selected>中（20%）</option>
        <option value="0.33">密（33%）</option>
      </select>
      <button class="btn btn-sage" id="btnGen">生成练习</button>
    </div>
    <div class="row" id="aiRow" style="display:none;">
      <label>想要的内容（一句话）：</label>
      <input type="text" id="aiReq" placeholder="例如：一篇讲创业的英文短篇，150 词左右">
      <button class="btn btn-acc" id="btnAIGo">生成候选</button>
    </div>
    <div class="row" id="pasteRow" style="display:none;">
      <textarea id="pasteText" placeholder="粘贴英文文本到这里，然后点「生成练习」"></textarea>
    </div>
    <div id="candBox"></div>
  </div>

  <article id="article" style="display:none;">
    <div class="story-title" id="storyTitle"></div>
    <div class="story-meta" id="storyMeta"></div>
    <div class="story" id="story"></div>
    <div class="foot">
      <button class="btn btn-sage" id="btnCheck">✓ 提交判定</button>
      <button class="btn btn-line" id="btnReveal">显示答案</button>
      <div class="stat">正确 <b class="ok" id="stOk">0</b> · 错误 <b class="err" id="stErr">0</b> · 未答 <b id="stLeft">0</b></div>
    </div>
    <div class="wrongbox" id="wrongbox">
      <h4>📒 错题本（本轮没写对的词）</h4>
      <div id="wrongList"></div>
    </div>
  </article>

  <footer>词境挖空 · 把喜欢的内容变成填空练习 —— 主动写出来，比认出来记得更牢</footer>
</div>

<script>
(function(){
"use strict";

/* ============ 网关调用 ============ */
var GW = localStorage.getItem("wcGateway") || "http://localhost:3000";
function setAiBusy(){ }
async function gatewayChat(model, content){
  var r = await fetch(GW + "/v1/chat/completions", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({model:model, messages:[{role:"user",content:content}], stream:false})
  });
  if(!r.ok){ var t=await r.text().catch(function(){return "";}); throw new Error("网关 "+r.status+"："+t.slice(0,150)); }
  var d = await r.json();
  var m = d.choices && d.choices[0] && d.choices[0].message;
  return (m && m.content) || "";
}
function extractJSON(text){
  var m=text.match(/```(?:json)?\s*([\s\S]*?)```/i); if(m) text=m[1];
  var a=text.indexOf("{"); var b=text.lastIndexOf("}");
  if(a<0||b<=a) throw new Error("未找到 JSON");
  return JSON.parse(text.slice(a,b+1));
}
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

/* ============ 状态 ============ */
var cur = null;   // {title, tokens:[{word,blank}]}

var el = {
  aiRow:document.getElementById("aiRow"), pasteRow:document.getElementById("pasteRow"),
  candBox:document.getElementById("candBox"), article:document.getElementById("article"),
  storyTitle:document.getElementById("storyTitle"), storyMeta:document.getElementById("storyMeta"),
  story:document.getElementById("story"), pgDone:document.getElementById("pgDone"),
  pgTotal:document.getElementById("pgTotal"), stOk:document.getElementById("stOk"),
  stErr:document.getElementById("stErr"), stLeft:document.getElementById("stLeft"),
  wrongbox:document.getElementById("wrongbox"), wrongList:document.getElementById("wrongList"),
  bookCnt:document.getElementById("bookCnt")
};

/* ============ 内置示例 ============ */
var DEMO = {
  title: "The Little Bakery That Could",
  text: "Maria opened a tiny bakery at the corner of a quiet street. At first, only a few customers came, and she worried the business would fail. But she kept baking fresh bread every morning and greeted everyone with a genuine smile. Slowly, neighbors began to gather around her warm little shop. They loved the smell of roasted bread and the friendly welcome. Word spread quickly, and soon people from across town came to try her famous pumpkin pie. Maria learned that success does not happen overnight. It grows quietly, one small kindness at a time, until it becomes something beautiful and lasting."
};

/* ============ 挖空引擎 ============ */
function tokenize(text){
  // 分词，保留词和它前后的分隔符，便于还原
  var re = /[A-Za-z]+(?:'[A-Za-z]+)?/g;
  var tokens = [];
  var last = 0;
  var m;
  while((m = re.exec(text)) !== null){
    tokens.push({word:m[0], start:m.index, end:m.index+m[0].length});
  }
  return tokens;
}
function makeBlanks(title, text, density){
  var tokens = tokenize(text);
  // 过滤：短词(<3)、纯大写缩写、去重
  var seen = {};
  var candidates = tokens.filter(function(t){
    var w = t.word;
    if(w.length < 3) return false;
    if(w === w.toUpperCase()) return false;  // 全大写（专有名词/缩写）跳过
    if(seen[w.toLowerCase()]) return false;
    seen[w.toLowerCase()] = true;
    return true;
  });
  // 按密度选
  var n = Math.max(1, Math.round(candidates.length * density));
  // 均匀采样
  var picks = [];
  if(candidates.length <= n){ picks = candidates.slice(); }
  else {
    var step = candidates.length / n;
    for(var i=0;i<n;i++){ picks.push(candidates[Math.floor(i*step)]); }
  }
  var pickSet = {};
  picks.forEach(function(t){ pickSet[t.start] = t.word; });
  // 组装成 blanks 数组（按原文顺序）
  var blanks = [];
  tokens.forEach(function(t){
    if(pickSet[t.start]) blanks.push({word:t.word});
  });
  return {title:title, text:text, blanks:blanks, tokens:tokens};
}

/* ============ 渲染 ============ */
function render(cur){
  el.article.style.display = "block";
  el.storyTitle.textContent = cur.title;
  el.storyMeta.textContent = "共挖空 " + cur.blanks.length + " 个词 · 打字填入，回车跳到下一个";
  el.pgTotal.textContent = cur.blanks.length;
  el.pgDone.textContent = 0;
  el.stOk.textContent = 0; el.stErr.textContent = 0; el.stLeft.textContent = cur.blanks.length;
  el.wrongbox.classList.remove("show"); el.wrongList.innerHTML = "";
  el.bookCnt.textContent = "(0)";

  // 把原文挖空：按 start 位置替换为 <input>
  var html = "";
  // 按词去重——每个词只挖第一次出现（大小写不敏感）
  var usedStart = {};
  var usedWord = {};
  cur.tokens.forEach(function(t){
    var w = t.word.toLowerCase();
    if(usedWord[w]) return;
    for(var i=0;i<cur.blanks.length;i++){
      if(cur.blanks[i].word.toLowerCase() === w){
        usedWord[w] = true; usedStart[t.start] = i; break;
      }
    }
  });
  // 按原文切片
  var text = cur.text;
  var pos = 0;
  cur.tokens.forEach(function(t){
    var pre = text.slice(pos, t.start);
    html += esc(pre);
    if(usedStart[t.start] !== undefined){
      html += '<input class="blank" data-word="'+esc(t.word)+'" data-idx="'+usedStart[t.start]+'" autocomplete="off" spellcheck="false">';
    } else {
      html += esc(t.word);
    }
    pos = t.end;
  });
  html += esc(text.slice(pos));
  el.story.innerHTML = html;
  // 绑定输入事件
  el.story.querySelectorAll(".blank").forEach(function(inp){
    inp.addEventListener("keydown", function(e){
      if(e.key === "Enter"){
        e.preventDefault();
        var next = el.story.querySelectorAll(".blank");
        for(var i=0;i<next.length;i++){
          if(next[i] === inp && i < next.length-1){ next[i+1].focus(); break; }
        }
      }
    });
    inp.addEventListener("input", function(){ inp.classList.remove("ok","err"); });
  });
}

/* ============ 判定 ============ */
function normalize(s){
  return String(s).trim().toLowerCase().replace(/[^a-z']/g, "");
}
function checkAll(){
  var blanks = el.story.querySelectorAll(".blank");
  var ok=0, err=0, wrong=[];
  blanks.forEach(function(inp){
    var ans = normalize(inp.value);
    var std = normalize(inp.getAttribute("data-word"));
    if(!ans){ return; }
    if(ans === std){ inp.classList.add("ok"); ok++; }
    else { inp.classList.add("err"); err++; wrong.push({word:inp.getAttribute("data-word"), yours:inp.value}); }
  });
  var left = blanks.length - ok - err;
  el.pgDone.textContent = ok + err;
  el.stOk.textContent = ok; el.stErr.textContent = err; el.stLeft.textContent = left;
  // 错题本
  if(wrong.length){
    el.wrongbox.classList.add("show");
    el.wrongList.innerHTML = wrong.map(function(w){
      return '<span class="w-item">'+esc(w.word)+' <span class="ans">(你写：'+esc(w.yours)+')</span></span>';
    }).join("");
    el.bookCnt.textContent = "(" + wrong.length + ")";
  }
  return {ok:ok, err:err, left:left};
}

function revealAll(){
  el.story.querySelectorAll(".blank").forEach(function(inp){
    if(!inp.classList.contains("ok")){
      inp.value = inp.getAttribute("data-word");
      inp.classList.add("show");
    }
  });
}

/* ============ 事件 ============ */
document.getElementById("btnDemo").addEventListener("click", function(){
  cur = makeBlanks(DEMO.title, DEMO.text, parseFloat(document.getElementById("density").value));
  render(cur);
});
document.getElementById("btnPaste").addEventListener("click", function(){
  el.pasteRow.style.display = "flex"; el.aiRow.style.display = "none"; el.candBox.innerHTML = "";
});
document.getElementById("btnAI").addEventListener("click", function(){
  el.aiRow.style.display = "flex"; el.pasteRow.style.display = "none"; el.candBox.innerHTML = "";
});
document.getElementById("btnGen").addEventListener("click", function(){
  var t = document.getElementById("pasteText").value.trim();
  if(!t){ alert("请先粘贴文本，或点「内置示例」。"); return; }
  cur = makeBlanks("自定义内容", t, parseFloat(document.getElementById("density").value));
  render(cur);
});
document.getElementById("btnCheck").addEventListener("click", function(){
  if(!cur) return;
  var r = checkAll();
  if(r.left === 0 && r.err === 0){ alert("🎉 全部答对！"); }
});
document.getElementById("btnReveal").addEventListener("click", revealAll);
document.getElementById("btnBook").addEventListener("click", function(){
  el.wrongbox.classList.toggle("show");
});

/* ============ AI 内容供给（多方案比选） ============ */
document.getElementById("btnAIGo").addEventListener("click", async function(){
  var req = document.getElementById("aiReq").value.trim();
  if(!req){ alert("请先输入想要的内容需求。"); return; }
  el.candBox.innerHTML = '<div class="loading"><span class="dot"></span><span class="dot"></span><span class="dot"></span>AI 正在生成 2-3 篇候选短文...</div>';
  try{
    var p = "你是英语学习内容供给助手。用户想要：" + req + "\n\n请写 3 篇不同的英文短篇（每篇 100-180 词，适合做词汇填空练习），主题围绕用户需求但有差异（角度/情节不同）。\n\n严格输出 JSON（不要代码块、不要其他文字）：\n{\"candidates\":[{\"title\":\"...\",\"text\":\"...\"},{\"title\":\"...\",\"text\":\"...\"},{\"title\":\"...\",\"text\":\"...\"}]}";
    var raw = await gatewayChat("gemini-2.5-flash", p);
    var obj = extractJSON(raw);
    var cands = obj.candidates || [];
    if(!cands.length) throw new Error("未生成候选");
    el.candBox.innerHTML = '<div style="font-size:13px;color:var(--text-secondary);margin-bottom:6px;">AI 给出 '+cands.length+' 篇候选，选一篇开始挖空：</div>';
    cands.forEach(function(c,i){
      var b = document.createElement("button");
      b.className = "cand";
      b.innerHTML = '<div class="ct">' + esc(c.title) + '</div><div class="cp">' + esc((c.text||"").slice(0,80)) + '...</div>';
      b.addEventListener("click", function(){
        cur = makeBlanks(c.title, c.text, parseFloat(document.getElementById("density").value));
        render(cur);
      });
      el.candBox.appendChild(b);
    });
  }catch(e){
    el.candBox.innerHTML = '<div class="note">❌ 生成失败：' + esc(e.message) + '。请确认网关 :3000 已启动。也可改用「粘贴文本」。</div>';
  }
});

/* 默认加载内置示例 */
cur = makeBlanks(DEMO.title, DEMO.text, 0.2);
render(cur);
})();
</script>
</body>
</html>
