<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>组件编排器 —— AI 画布观察窗 UI</title>
<link rel="stylesheet" href="styles.css">
<script>document.documentElement.setAttribute('data-theme',localStorage.getItem('theme')||'light')</script>
</head>
<body>

<!-- 1. 阶段时间线 Header -->
<header class="top-header">
  <div class="brand-title">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M7 4v16M17 4v16M2 9h5M2 15h5M17 9h5M17 15h5"/></svg> 课件编排器 <span>AI 自治观察窗</span>
  </div>

  <div class="top-right">
    <div class="timeline-stepper" id="timeline-stepper">
      <div class="step-item active" id="step-framework"><div class="step-dot"></div>1. 框架生成</div>
      <div class="step-item" id="step-scan"><div class="step-dot"></div>2. 槽位扫描</div>
      <div class="step-item" id="step-asset_fill"><div class="step-dot"></div>3. 资产填充</div>
      <div class="step-item" id="step-verify"><div class="step-dot"></div>4. 规则校验</div>
      <div class="step-item" id="step-deliver"><div class="step-dot"></div>5. 交付完工</div>
    </div>
    <button class="theme-toggle" id="theme-toggle" aria-label="切换深色模式" title="切换深色模式">
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>

<!-- 2. 主体槽位卡片网格区 -->
<main class="canvas-body" id="slot-grid">
  <!-- 动态挂载媒体槽位状态卡片与预览截图墙 -->
</main>

<!-- 3. 右侧 SSE 事件流日志面板 -->
<aside class="sidebar-logs">
  <div class="log-title">
    <span><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;vertical-align:-2px"><circle cx="12" cy="12" r="2"/><path d="M16.2 7.8a6 6 0 0 1 0 8.4M7.8 7.8a6 6 0 0 0 0 8.4M18.4 5.6a10 10 0 0 1 0 12.8M5.6 5.6a10 10 0 0 0 0 12.8"/></svg> 编排器 SSE 事件流</span>
    <span style="font-size:11px;color:var(--text-muted);font-weight:600;" id="event-count">0 条事件</span>
  </div>
  <div class="log-stream" id="log-stream"></div>
</aside>

<!-- 4. 底部 L2 确认控制条 -->
<footer class="bottom-bar">
  <div style="display:flex;align-items:center;gap:14px;">
    <span style="font-size:13px;font-weight:700;">进度: <b id="progress-text" style="color:var(--primary);">0/0</b></span>
    <span style="font-size:12px;color:var(--text-muted);">已用时间: <b id="timer-text" style="color:var(--text-main);">00:00</b></span>
  </div>

  <div style="display:flex;align-items:center;gap:10px;">
    <button type="button" class="btn" id="confirm-btn" onclick="sendConfirmAction()"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;vertical-align:-2px"><path d="M20 6 9 17l-5-5"/></svg> L2 关键节点确认继续</button>
  </div>
</footer>

<script src="mock_events.js"></script>
<script src="app.js"></script>
<script>
(function(){
  var d=document.documentElement, b=document.getElementById('theme-toggle');
  if(!b) return;
  b.addEventListener('click', function(){
    var n = d.getAttribute('data-theme')==='dark' ? 'light' : 'dark';
    d.setAttribute('data-theme', n);
    try { localStorage.setItem('theme', n); } catch(e){}
  });
})();
</script>
</body>
</html>
