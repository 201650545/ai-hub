<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>美术资源库 — AI 生图素材</title>
<link rel="stylesheet" href="styles.css">
<style>
/* 美术资源库 专属样式 */
.gallery-page {
  position: relative;
  width: 100vw; min-height: 100vh;
  padding: 92px 32px 32px;
  overflow-y: auto;
}
.gallery-page h1 { font-size: 32px; font-weight: 700; margin-bottom: 4px; }
.gallery-page .subtitle { font-size: 14px; color: var(--text-muted); margin-bottom: 32px; }
.gallery-section { margin-bottom: 48px; }
.gallery-section h2 { font-size: 21px; font-weight: 600; margin-bottom: 16px; }
.site-grid { display: flex; flex-wrap: wrap; gap: 12px; }
.site-tag {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 16px; border-radius: 9999px;
  background: var(--bg-card); border: 1px solid var(--border-card);
  font-size: 13px; font-weight: 600; color: var(--text-main);
  transition: all 0.2s var(--ease);
}
.site-tag:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-glow); }
.sample-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 18px;
}
.sample-card {
  background: var(--bg-card); border: 1px solid var(--border-card);
  border-radius: 16px; overflow: hidden;
  box-shadow: var(--shadow-card); transition: all 0.25s var(--ease);
}
.sample-card:hover { border-color: var(--text-muted); transform: translateY(-2px); }
.sample-card img { width: 100%; height: 200px; object-fit: cover; display: block; background: var(--bg-card-hover); }
.sample-card .info { padding: 12px 16px; }
.sample-card .name { font-size: 13px; font-weight: 600; color: var(--text-main); }
.sample-card .size { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.back-link {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 13px; color: var(--primary); font-weight: 500;
  margin-bottom: 16px; cursor: pointer;
}
.back-link:hover { text-decoration: underline; }
</style>
<link rel="stylesheet" href="skins.css"></head>
<body>

<header class="top-header" style="position:fixed;top:14px;left:16px;right:16px;z-index:100;background:rgba(255,255,255,0.72);backdrop-filter:saturate(180%)blur(20px);-webkit-backdrop-filter:saturate(180%)blur(20px);border:1px solid var(--border-card);border-radius:16px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;box-shadow:var(--shadow-card);height:64px;">

  <div class="brand-title">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><circle cx="12" cy="12" r="3"/><circle cx="19" cy="5" r="2"/><circle cx="5" cy="19" r="2"/><path d="M6.5 6.5l4 4M14 17l3.5 3.5"/></svg> 美术资源库 <span>AI 生图素材</span>
  </div>
  <div class="top-right">
    <a href="/" style="font-size:13px;color:var(--primary);font-weight:500;text-decoration:none;">← 返回编排画布</a>
  </div>
</header>

<main class="gallery-page">
  <div style="max-width:1200px;margin:0 auto;">

    <h1>美术资源库</h1>
    <p class="subtitle">AI 生图引擎产出的美术素材与勘探样例，供课件编排/画布工具使用。</p>

    <div class="gallery-section">
      <h2>生图站点</h2>
      <div class="site-grid">
        <span class="site-tag">🧠 ChatGPT 镜像</span>
        <span class="site-tag">🫘 字节豆包</span>
        <span class="site-tag">✨ Gemini 官方</span>
        <span class="site-tag">🎨 哩布哩布 Liblib</span>
        <span class="site-tag">🔮 通义千问</span>
        <span class="site-tag">💡 智谱清言</span>
      </div>
    </div>

    <div class="gallery-section">
      <h2>勘探样例（AI 生图产出）</h2>
      <div class="sample-grid" id="sample-grid">
        <!-- 动态从 JS 渲染，方便后续扩展 -->
      </div>
    </div>

  </div>
</main>

<script>
const SAMPLES = [
  {name:"豆包 Seedream", file:"doubao_pro.png", size:"120 KB"},
  {name:"Gemini 3.6 Flash", file:"gemini_official_pro.png", size:"447 KB"},
  {name:"Gemini 修复版", file:"gemini_fixed.png", size:"657 KB"},
  {name:"ChatGPT 镜像", file:"chatgpt_mirror_pro.png", size:"199 KB"},
  {name:"智谱清言", file:"zhipu_pro.png", size:"31 KB"},
  {name:"Kimi (探针)", file:"probe_kimi.png", size:"2.5 KB"},
  {name:"Liblib (探针)", file:"probe_liblib.png", size:"1.5 KB"},
];
const grid = document.getElementById('sample-grid');
SAMPLES.forEach(s => {
  const card = document.createElement('div');
  card.className = 'sample-card';
  card.innerHTML = `
    <img src="../勘探样例/${s.file}" alt="${s.name}" loading="lazy" onerror="this.style.display='none'">
    <div class="info">
      <div class="name">${s.name}</div>
      <div class="size">${s.size}</div>
    </div>`;
  grid.appendChild(card);
});
</script>
<script src="skins.js"></script>
</body>
</html>
