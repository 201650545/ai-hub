<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI 搜索聚合 — 多引擎对比控制台</title>
<style>
:root {
  --bg-canvas: #f5f5f7;
  --bg-glass: rgba(255, 255, 255, 0.82);
  --bg-card: #ffffff;
  --text-main: #1d1d1f;
  --text-muted: #6e6e73;
  --hairline: #d2d2d7;
  --card-border: #d2d2d7;
  --primary: #0071e3;
  --primary-hover: #0077ed;
  --green: #34c759;
  --amber: #ff9f0a;
  --red: #ff3b30;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
  --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.12);
}
:root {
  --accent: #0071e3;
  --accent-hover: #0077ed;
  --accent-subtle: #e8f1fd;
  --text-primary: #1d1d1f;
  --text-secondary: #6e6e73;
  --text-tertiary: #86868b;
  --line: #d2d2d7;
  --line-strong: #86868b;
  --success: #34c759;
  --danger: #ff3b30;
  --warning: #ff9f0a;
  --radius-lg: 18px;
  --radius-md: 12px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
  background: var(--bg-canvas);
  color: var(--text-main);
  user-select: none;
  -webkit-font-smoothing: antialiased;
  touch-action: none;
}

/* ---------- 顶部全域悬浮控制栏 ---------- */
.top-nav {
  position: fixed;
  top: 14px;
  left: 16px;
  right: 16px;
  height: 60px;
  z-index: 100;
  background: rgba(255, 255, 255, 0.94);
  backdrop-filter: saturate(180%) blur(16px);
  -webkit-backdrop-filter: saturate(180%) blur(16px);
  border: 1.5px solid var(--card-border);
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  box-shadow: var(--shadow-sm);
}

.brand {
  font-size: 16px;
  font-weight: 800;
  color: #000;
  display: flex;
  align-items: center;
  gap: 8px;
  white-space: nowrap;
}
.brand span {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  background: #e8e8ed;
  padding: 3px 6px;
  border-radius: 6px;
}

.global-search-box {
  flex: 1;
  max-width: 540px;
  margin: 0 14px;
  display: flex;
  gap: 8px;
}
.global-search-box input {
  flex: 1;
  padding: 10px 16px;
  border-radius: 980px;
  border: 1.5px solid var(--hairline);
  font-size: 14px;
  font-weight: 600;
  outline: none;
  background: #fff;
  transition: all 0.15s;
}
.global-search-box input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(0, 82, 204, 0.12);
}

.btn {
  background: #000;
  color: #fff;
  border: none;
  padding: 8px 18px;
  border-radius: 980px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s;
  white-space: nowrap;
  touch-action: manipulation;
}
.btn:hover { background: #222; transform: translateY(-1px); }
.btn-secondary {
  background: #f5f5f7;
  color: var(--text-main);
  border: 1.5px solid var(--card-border);
}
.btn-secondary:hover { background: #e8e8ed; }

.top-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

/* ---------- 左侧可折叠功能组件 Dock 抽屉 ---------- */
.left-dock {
  position: fixed;
  top: 86px;
  left: 16px;
  bottom: 16px;
  width: 280px;
  z-index: 90;
  background: rgba(255, 255, 255, 0.94);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1.5px solid var(--card-border);
  border-radius: 18px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  box-shadow: var(--shadow-sm);
  transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}
.left-dock.collapsed {
  transform: translateX(-310px);
}
.dock-toggle-btn {
  position: absolute;
  right: -36px;
  top: 18px;
  width: 34px;
  height: 34px;
  background: #fff;
  border: 1.5px solid var(--card-border);
  border-radius: 0 10px 10px 0;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: var(--shadow-sm);
  font-size: 14px;
}

.dock-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-bottom: 8px;
  border-bottom: 1.5px solid var(--card-border);
}
.dock-header h3 { font-size: 15px; font-weight: 800; }

.widget-library {
  flex: 1;
  max-height: calc(100vh - 170px);
  overflow-y: auto !important;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding-right: 4px;
}
.widget-library::-webkit-scrollbar {
  width: 6px;
}
.widget-library::-webkit-scrollbar-track {
  background: #f5f5f7;
  border-radius: 4px;
}
.widget-library::-webkit-scrollbar-thumb {
  background: #d2d2d7;
  border-radius: 4px;
}
.widget-library::-webkit-scrollbar-thumb:hover {
  background: var(--primary);
}
.library-card {
  background: #fff;
  border: 1.5px solid var(--card-border);
  border-radius: 12px;
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  cursor: grab;
  transition: all 0.2s;
  user-select: none;
}
.library-card:hover {
  border-color: var(--primary);
  box-shadow: 0 4px 12px rgba(0,82,204,0.08);
  transform: translateY(-1px);
}

/* ---------- 无限空间画布 Viewport & Canvas ---------- */
#canvas-viewport {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background-color: #f5f5f7;
  background-image: radial-gradient(#d2d2d7 1.5px, transparent 1.5px);
  background-size: 28px 28px;
  background-position: 0 0;
  cursor: grab;
  touch-action: none;
}
#canvas-viewport:active { cursor: grabbing; }

#spatial-canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 0;
  height: 0;
  overflow: visible;
  transform-origin: 0 0;
  pointer-events: none;
}

/* ---------- 画布上的功能组件 Widget Card ---------- */
.spatial-widget {
  position: absolute;
  pointer-events: auto;
  background: var(--bg-card);
  border: 1.5px solid var(--card-border);
  border-radius: 18px;
  box-shadow: var(--shadow-lg);
  display: flex;
  flex-direction: column;
  resize: both;
  overflow: hidden;
  min-width: 300px;
  min-height: 220px;
  user-select: text;
  transition: border-color 0.15s, box-shadow 0.15s;
  touch-action: auto;
}
.spatial-widget:focus-within, .spatial-widget.active-widget {
  border-color: var(--primary);
  box-shadow: 0 12px 36px rgba(0, 82, 204, 0.15);
}

.widget-head {
  padding: 10px 14px;
  background: #fafbfc;
  border-bottom: 1.5px solid var(--card-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: move;
  user-select: none;
  touch-action: none;
}
.widget-title {
  font-size: 14px;
  font-weight: 800;
  display: flex;
  align-items: center;
  gap: 8px;
}
.widget-badge {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  background: var(--bg-canvas);
  padding: 2px 6px;
  border-radius: 6px;
}
.widget-actions {
  display: flex;
  gap: 4px;
}
.icon-btn {
  background: transparent;
  border: none;
  color: var(--text-muted);
  font-size: 15px;
  cursor: pointer;
  padding: 2px 6px;
  border-radius: 6px;
  touch-action: manipulation;
}
.icon-btn:hover { background: #e8e8ed; color: #000; }

.widget-body {
  flex: 1;
  padding: 14px;
  overflow-y: auto;
  font-size: 14px;
  line-height: 1.75;
  color: #1d1d1f !important;
}

.node-body, .node-body *, .formatted-answer, .formatted-answer * {
  color: #1d1d1f !important;
}

.formatted-answer h1, .formatted-answer h2, .formatted-answer h3, .formatted-answer h4 {
  color: #1d1d1f !important;
  font-weight: 800 !important;
  margin-top: 14px !important;
  margin-bottom: 8px !important;
  line-height: 1.4 !important;
}
.formatted-answer p {
  margin-bottom: 10px !important;
  color: #1d1d1f !important;
}
.formatted-answer ul, .formatted-answer ol {
  padding-left: 22px !important;
  margin-bottom: 10px !important;
  color: #1d1d1f !important;
}
.formatted-answer li {
  margin-bottom: 6px !important;
  color: #1d1d1f !important;
}
.formatted-answer strong, .formatted-answer b {
  color: #000000 !important;
  font-weight: 800 !important;
}
.formatted-answer pre, .formatted-answer code {
  background: #f5f5f7 !important;
  color: #1d1d1f !important;
  padding: 4px 8px !important;
  border-radius: 6px !important;
  font-family: Consolas, monospace !important;
  font-size: 13px !important;
}

.widget-foot {
  padding: 6px 12px;
  border-top: 1.5px solid var(--card-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11px;
  color: var(--text-muted);
  font-weight: 600;
  user-select: none;
  background: #fafbfc;
}

/* ---------- 浮动画布视图控制 Toolbar ---------- */
.canvas-controls-toolbar {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 100;
  background: rgba(255, 255, 255, 0.94);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1.5px solid var(--card-border);
  border-radius: 14px;
  padding: 6px 12px;
  display: flex;
  align-items: center;
  gap: 8px;
  box-shadow: var(--shadow-lg);
  user-select: none;
}
.zoom-badge {
  font-size: 13px;
  font-weight: 800;
  color: var(--text-main);
  min-width: 44px;
  text-align: center;
}

/* ---------- 锁定时视觉风格 ---------- */
.canvas-locked .widget-head { cursor: default !important; }
.canvas-locked .spatial-widget { resize: none !important; }
.lock-badge {
  display: none;
  font-size: 11px;
  font-weight: 700;
  color: var(--amber);
  background: rgba(217, 119, 6, 0.12);
  padding: 3px 8px;
  border-radius: 6px;
}
.canvas-locked .lock-badge { display: inline-block; }

/* ---------- Modal 弹窗 ---------- */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; width: 100vw; height: 100vh;
  background: rgba(0,0,0,0.4);
  backdrop-filter: blur(8px);
  z-index: 1000;
  align-items: center;
  justify-content: center;
}

@media (max-width: 768px) {
  .top-nav { top: 8px; left: 10px; right: 10px; height: 52px; padding: 0 10px; }
  .brand b, .brand span { display: none; }
  .global-search-box { margin: 0 6px; }
  .global-search-box input { font-size: 13px; padding: 6px 12px; }
  .left-dock { top: auto; bottom: 70px; left: 10px; width: calc(100vw - 20px); max-height: 50vh; }
  .dock-toggle-btn { top: -32px; right: 16px; width: 32px; height: 32px; }
  .canvas-controls-toolbar { bottom: 10px; right: 10px; left: 10px; justify-content: space-between; }
}

/* ── 华为商务：科技蓝 + 网格纹理 + 方正 ── */
html[data-skin="huawei"]{
  --bg-canvas:#e8eef7; --bg-glass:rgba(255,255,255,.92); --bg-card:#ffffff;
  --primary:#007dff; --primary-hover:#0066cc; --accent:#007dff;
  --accent-hover:#0066cc; --accent-subtle:#e3edff;
  --card-border:#c5d3e8; --hairline:#c5d3e8;
  --radius-lg:10px; --radius-md:8px;
  --shadow-sm:0 1px 3px rgba(9,30,66,.14); --shadow-lg:0 14px 36px rgba(9,30,66,.22);
}
html[data-skin="huawei"] body{
  background:linear-gradient(180deg,#dce7f5 0%,#edf3fa 260px,#e8eef7 100%);
}
html[data-skin="huawei"] body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(0,125,255,.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,125,255,.05) 1px,transparent 1px);
  background-size:34px 34px;
}
html[data-skin="huawei"] .top-nav,
html[data-skin="huawei"] .left-dock{background:rgba(255,255,255,.96)!important;border-radius:10px;}
html[data-skin="huawei"] .brand{color:#00284d!important;font-weight:900;}
html[data-skin="huawei"] .btn{background:#007dff!important;border-radius:8px;}
html[data-skin="huawei"] .btn:hover{background:#0066cc!important;}

/* ── 小米活力：暖白 + 橙 + 大圆角 ── */
html[data-skin="xiaomi"]{
  --bg-canvas:#fff7f0; --primary:#ff6900; --primary-hover:#e55e00; --accent:#ff6900;
  --accent-subtle:#ffe8d9; --card-border:#ffd9bd; --radius-lg:20px; --radius-md:14px;
}
html[data-skin="xiaomi"] body{
  background:
    radial-gradient(900px 320px at 18% -8%,rgba(255,105,0,.14),transparent 60%),
    radial-gradient(700px 300px at 88% -4%,rgba(255,180,80,.12),transparent 55%),
    #fff7f0;
}
html[data-skin="xiaomi"] .top-nav,
html[data-skin="xiaomi"] .left-dock{background:rgba(255,255,255,.95)!important;border-radius:20px;}
html[data-skin="xiaomi"] .brand{color:#ff6900!important;font-weight:900;}
html[data-skin="xiaomi"] .btn{background:linear-gradient(135deg,#ff8a2a,#ff6900)!important;border-radius:999px;}
html[data-skin="xiaomi"] .btn:active{transform:scale(.94);}
html[data-skin="xiaomi"] .global-search-box input:focus{box-shadow:0 0 0 3px rgba(255,105,0,.16);}

/* ── 可爱动画：奶油粉紫 + 胖圆贴纸 ── */
html[data-skin="kawaii"]{
  --bg-canvas:#fdf0f5; --primary:#ff7eb6; --primary-hover:#f76aa8; --accent:#a78bfa;
  --accent-subtle:#ffe3ef; --card-border:#ffc4dd; --radius-lg:24px; --radius-md:18px;
}
html[data-skin="kawaii"] body{
  font-family:"Yuanti SC","YouYuan","幼圆","PingFang SC","Microsoft YaHei",sans-serif;
  background:
    radial-gradient(520px 380px at 12% 16%,rgba(167,139,250,.16),transparent 60%),
    radial-gradient(620px 420px at 86% 10%,rgba(255,126,182,.18),transparent 58%),
    radial-gradient(500px 400px at 70% 88%,rgba(110,231,183,.13),transparent 55%),
    #fdf0f5;
}
html[data-skin="kawaii"] .top-nav,
html[data-skin="kawaii"] .left-dock{
  background:rgba(255,255,255,.93)!important;border-radius:24px;
  border:2px solid #ffc4dd!important;box-shadow:0 6px 26px rgba(255,126,182,.18)!important;
}
html[data-skin="kawaii"] .brand{color:#ff5ca8!important;font-weight:900;}
html[data-skin="kawaii"] .btn{
  background:linear-gradient(135deg,#ff9ecb,#ff7eb6)!important;border-radius:999px;font-weight:800;
}
html[data-skin="kawaii"] .btn:hover{animation:kawaii-wiggle .45s ease-in-out;background:linear-gradient(135deg,#ff8ac2,#f76aa8)!important;}
html[data-skin="kawaii"] .widget-head{background:linear-gradient(90deg,#fff0f7,#f5efff);}
@keyframes kawaii-wiggle{
  0%,100%{transform:rotate(0)}25%{transform:rotate(-3deg) scale(1.04)}75%{transform:rotate(3deg) scale(1.04)}
}
html[data-skin="kawaii"] .skin-heart{
  position:fixed;z-index:9999;pointer-events:none;font-size:18px;
  animation:kawaii-float 1s ease-out forwards;
}
@keyframes kawaii-float{
  from{opacity:.95;transform:translateY(0) scale(.7)}
  to{opacity:0;transform:translateY(-64px) scale(1.35)}
}

/* ── 切换器悬浮坞 ── */
#skin-dock{position:fixed;right:16px;bottom:76px;z-index:200;display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
#skin-fab{
  width:44px;height:44px;border-radius:50%;border:none;cursor:pointer;font-size:20px;
  background:rgba(255,255,255,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:var(--shadow-lg);transition:transform .15s;
}
#skin-fab:hover{transform:scale(1.1) rotate(12deg);}
#skin-menu{
  display:none;flex-direction:column;gap:6px;padding:10px;border-radius:16px;
  background:rgba(255,255,255,.95);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1.5px solid var(--card-border);box-shadow:var(--shadow-lg);
}
#skin-menu.open{display:flex;}
.skin-chip{
  display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:11px;border:1.5px solid transparent;
  background:transparent;cursor:pointer;font-size:13px;font-weight:700;color:var(--text-main);white-space:nowrap;
}
.skin-chip:hover{background:var(--accent-subtle);}
.skin-chip.on{border-color:var(--primary);background:var(--accent-subtle);}
#skin-toast{
  position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);z-index:300;
  padding:9px 20px;border-radius:999px;background:rgba(20,20,30,.86);color:#fff;
  font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:all .25s;
}
#skin-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

<body>

<!-- 1. 顶部全域悬浮控制与搜索 Bar -->
<header class="top-nav">
  <div class="brand">
    🌐 AI <b>搜索</b> <span class="lock-badge" id="lock-badge-top">🔒 画布已锁定</span>
  </div>

  <div class="global-search-box">
    <input id="global-prompt-input" type="text" placeholder="输入问题，发起多引擎对比搜索…" onkeydown="if(event.key==='Enter') triggerGlobalCanvasSearch()">
    <button type="button" id="global-search-btn" class="btn" onclick="triggerGlobalCanvasSearch()">🔍 搜索</button>
  </div>

  <div class="top-actions">
    <button type="button" class="btn btn-secondary" onclick="openPresetModal()" title="保存或切换组合视图预设">💾 组合视图</button>
    <button type="button" class="btn btn-secondary" onclick="openHistoryModal()">📜 历史</button>
  </div>
</header>

<!-- 2. 左侧可折叠功能组件 Dock 抽屉 -->
<aside class="left-dock" id="left-dock" onwheel="event.stopPropagation()" ontouchmove="event.stopPropagation()">
  <div class="dock-toggle-btn" onclick="toggleDock()" title="展开/收起组件库">◀</div>
  
  <div class="dock-header">
    <h3>🧩 功能组件库</h3>
    <div style="display:flex;gap:4px;">
      <button type="button" style="font-size:10px;padding:2px 6px;border-radius:6px;border:1px solid #d2d2d7;background:#f8fafc;cursor:pointer;" onclick="toggleAllCategoryGroups(true)">全展开</button>
      <button type="button" style="font-size:10px;padding:2px 6px;border-radius:6px;border:1px solid #d2d2d7;background:#f8fafc;cursor:pointer;" onclick="toggleAllCategoryGroups(false)">全折叠</button>
    </div>
  </div>

  <div style="padding:2px 0;">
    <input type="text" id="dock-search-filter" placeholder="🔍 查找组件 (如: Kimi, API)..." oninput="filterWidgetLibrary(this.value)" style="width:100%;padding:5px 10px;border:1.5px solid var(--card-border);border-radius:8px;font-size:11px;background:#f8fafc;box-sizing:border-box;">
  </div>

  <div class="widget-library" id="widget-library" onwheel="event.stopPropagation()" ontouchmove="event.stopPropagation()"></div>
</aside>

<!-- 3. 全屏无限空间画布 Viewport -->
<main id="canvas-viewport"
      onwheel="handleCanvasWheel(event)"
      onmousedown="handleCanvasMouseDown(event)"
      ontouchstart="handleCanvasTouchStart(event)"
      ontouchmove="handleCanvasTouchMove(event)"
      ontouchend="handleCanvasTouchEnd(event)"
      ondragover="handleCanvasDragOver(event)"
      ondrop="handleCanvasDrop(event)">
  <div id="spatial-canvas"></div>
</main>

<!-- 4. 浮动画布视图控制 Toolbar -->
<div class="canvas-controls-toolbar">
  <button type="button" id="lock-btn" class="btn btn-secondary" style="padding:6px 12px;font-size:13px;" onclick="toggleCanvasLock()" title="锁定组合视图">🔓 未锁定</button>
  <button type="button" id="hand-mode-btn" class="btn btn-secondary" style="padding:6px 12px;font-size:13px;" onclick="toggleHandMode()" title="切换抓手平移模式">🖐️ 抓手平移</button>

<script>
/* ==========================================================================

const AVAILABLE_WIDGET_TYPES = {
  "yuanbao": { id: "yuanbao", type: "search", category: "search", name: "腾讯元宝 AI 搜", icon: "🐧", badge: "微信公众号 + 全网" },
  "doubao": { id: "doubao", type: "search", category: "search", name: "字节豆包 AI 搜", icon: "🧩", badge: "字节抖音全网实时" },
  "kimi": { id: "kimi", type: "search", category: "search", name: "月之暗面 Kimi", icon: "🌙", badge: "200万字长上下文" },

let activeWidgets = JSON.parse(localStorage.getItem('spatial_widgets_state_v4') || '[]') || [];
activeWidgets = activeWidgets.filter(id => AVAILABLE_WIDGET_TYPES[id]);  // 剔除已下架 widget 的残留 id
if (!activeWidgets.length) {
  activeWidgets = ['yuanbao', 'doubao', 'kimi', 'qianwen', 'metaso', 'grok', 'perplexity', 'zai'];
}
localStorage.setItem('spatial_widgets_state_v4', JSON.stringify(activeWidgets));  // 持久化清理结果
let widgetPositions = JSON.parse(localStorage.getItem('spatial_widgets_pos_v4') || '{}');

let canvasPanX = 40, canvasPanY = 90, canvasZoomScale = 1.0;
let isPanning = false, startPanX = 0, startPanY = 0;
let isHandMode = false, isSpacePressed = false, isCanvasLocked = false;
let touchPinchStartDist = 0, initialTouchZoom = 1.0;

/* ---------- 切换与锁定画布 ---------- */
function toggleCanvasLock() {
  isCanvasLocked = !isCanvasLocked;
  const vp = document.getElementById('canvas-viewport');
  const btn = document.getElementById('lock-btn');
  if (vp) vp.classList.toggle('canvas-locked', isCanvasLocked);
  if (btn) {
    btn.innerText = isCanvasLocked ? '🔒 已锁定' : '🔓 未锁定';
    btn.style.background = isCanvasLocked ? 'var(--amber)' : '#f5f5f7';
    btn.style.color = isCanvasLocked ? '#fff' : 'var(--text-main)';
  }
}

function toggleHandMode() {
  if (isCanvasLocked) return;
  isHandMode = !isHandMode;
  const btn = document.getElementById('hand-mode-btn');
  const vp = document.getElementById('canvas-viewport');
  if (btn) {
    btn.style.background = isHandMode ? 'var(--primary)' : '#f5f5f7';
    btn.style.color = isHandMode ? '#fff' : 'var(--text-main)';
  }
  if (vp) vp.style.cursor = isHandMode ? 'grab' : 'default';
}

function updateCanvasTransform() {
  const canvas = document.getElementById('spatial-canvas');
  const viewport = document.getElementById('canvas-viewport');
  const badge = document.getElementById('zoom-badge');
  if (canvas) {
    canvas.style.transform = `translate(${canvasPanX}px, ${canvasPanY}px) scale(${canvasZoomScale})`;
  }
  if (viewport) {
    const gridGradSize = 28 * canvasZoomScale;
    viewport.style.backgroundSize = `${gridGradSize}px ${gridGradSize}px`;
    viewport.style.backgroundPosition = `${canvasPanX}px ${canvasPanY}px`;
  }
  if (badge) badge.innerText = `${Math.round(canvasZoomScale * 100)}%`;
}

function zoomCanvas(delta) {
  if (isCanvasLocked) return;
  canvasZoomScale = Math.min(Math.max(0.2, canvasZoomScale + delta), 2.5);
  updateCanvasTransform();
}

function resetCanvasTransform() {
  canvasPanX = 40; canvasPanY = 90; canvasZoomScale = 1.0;
  updateCanvasTransform();
}

function handleCanvasWheel(ev) {
  if (isCanvasLocked) return;
  ev.preventDefault();
  if (ev.ctrlKey || ev.metaKey) {
    const zoomFactor = ev.deltaY < 0 ? 1.06 : 0.94;
    const newScale = Math.min(Math.max(0.2, canvasZoomScale * zoomFactor), 2.5);
    const viewport = document.getElementById('canvas-viewport');
    const rect = viewport ? viewport.getBoundingClientRect() : { left: 0, top: 0 };
    const mouseX = ev.clientX - rect.left;
    const mouseY = ev.clientY - rect.top;

    canvasPanX = mouseX - (mouseX - canvasPanX) * (newScale / canvasZoomScale);
    canvasPanY = mouseY - (mouseY - canvasPanY) * (newScale / canvasZoomScale);
    canvasZoomScale = newScale;
  } else {
    canvasPanX -= ev.deltaX;
    canvasPanY -= ev.deltaY;
  }
  updateCanvasTransform();
}

function handleCanvasMouseDown(ev) {
  if (isCanvasLocked) return;
  const isWidgetClick = ev.target.closest('.spatial-widget');
  if (isWidgetClick && !isSpacePressed && !isHandMode) return;

  isPanning = true;
  startPanX = ev.clientX - canvasPanX;
  startPanY = ev.clientY - canvasPanY;
  const viewport = document.getElementById('canvas-viewport');
  if (viewport) viewport.style.cursor = 'grabbing';

  function onMouseMove(e) {
    if (!isPanning) return;
    canvasPanX = e.clientX - startPanX;
    canvasPanY = e.clientY - startPanY;
    updateCanvasTransform();
  }

  function onMouseUp() {
    isPanning = false;
    if (viewport) viewport.style.cursor = (isHandMode || isSpacePressed) ? 'grab' : 'default';
    window.removeEventListener('mousemove', onMouseMove);
    window.removeEventListener('mouseup', onMouseUp);
  }

  window.addEventListener('mousemove', onMouseMove);
  window.addEventListener('mouseup', onMouseUp);
}

function getTouchDistance(touches) {
  const dx = touches[0].clientX - touches[1].clientX;
  const dy = touches[0].clientY - touches[1].clientY;
  return Math.sqrt(dx * dx + dy * dy);
}

function handleCanvasTouchStart(ev) {
  if (isCanvasLocked) return;
  if (ev.touches.length === 1) {
    const isWidgetTouch = ev.target.closest('.spatial-widget');
    if (!isWidgetTouch || isHandMode) {
      isPanning = true;
      startPanX = ev.touches[0].clientX - canvasPanX;
      startPanY = ev.touches[0].clientY - canvasPanY;
    }
  } else if (ev.touches.length === 2) {
    isPanning = false;
    touchPinchStartDist = getTouchDistance(ev.touches);
    initialTouchZoom = canvasZoomScale;
  }
}

function handleCanvasTouchMove(ev) {
  if (isCanvasLocked) return;
  if (ev.touches.length === 1 && isPanning) {
    canvasPanX = ev.touches[0].clientX - startPanX;
    canvasPanY = ev.touches[0].clientY - startPanY;
    updateCanvasTransform();
  } else if (ev.touches.length === 2 && touchPinchStartDist > 0) {
    const currentDist = getTouchDistance(ev.touches);
    const factor = currentDist / touchPinchStartDist;
    canvasZoomScale = Math.min(Math.max(0.2, initialTouchZoom * factor), 2.5);
    updateCanvasTransform();
  }
}

function handleCanvasTouchEnd() {
  isPanning = false; touchPinchStartDist = 0;
}

function toggleDock() {
  const dock = document.getElementById('left-dock');
  const btn = dock.querySelector('.dock-toggle-btn');
  dock.classList.toggle('collapsed');
  btn.innerText = dock.classList.contains('collapsed') ? '▶' : '◀';
}

const WIDGET_CATEGORIES = [
  { id: "search", title: "🔍 AI 全网搜索引擎", badge: "7大AI智搜" }
];

let categoryExpandedState = {
  search: true
};

function toggleCategoryGroup(catId) {
  categoryExpandedState[catId] = !categoryExpandedState[catId];
  renderWidgetLibrary();
}

function toggleAllCategoryGroups(openState) {
  Object.keys(categoryExpandedState).forEach(k => {
    categoryExpandedState[k] = openState;
  });
  renderWidgetLibrary();
}

function filterWidgetLibrary(query) {
  renderWidgetLibrary();
}

function renderWidgetLibrary() {
  const library = document.getElementById('widget-library');
  if (!library) return;
  library.innerHTML = '';

  const filterQuery = (document.getElementById('dock-search-filter') ? document.getElementById('dock-search-filter').value : '').toLowerCase().trim();

  WIDGET_CATEGORIES.forEach(cat => {
    let items = Object.values(AVAILABLE_WIDGET_TYPES).filter(w => w.category === cat.id);
    if (filterQuery) {
      items = items.filter(w => (w.name + w.badge).toLowerCase().includes(filterQuery));
    }
    if (!items.length) return;

    const isOpen = categoryExpandedState[cat.id] !== false;
    const group = document.createElement('div');
    group.className = 'category-group';
    group.style.cssText = 'margin-bottom:10px;background:#f8fafc;border:1px solid var(--card-border);border-radius:10px;';

    const countAdded = items.filter(w => activeWidgets.includes(w.id)).length;

    const header = document.createElement('div');
    header.style.cssText = 'padding:8px 10px;font-size:12px;font-weight:700;color:var(--text-main);cursor:pointer;user-select:none;display:flex;align-items:center;justify-content:space-between;background:#f5f5f7;border-radius:10px;';
    header.onclick = () => toggleCategoryGroup(cat.id);
    header.innerHTML = `
      <span>${isOpen ? '▼' : '▶'} ${cat.title} <span style="font-size:10px;font-weight:500;color:var(--text-muted);">(${cat.badge})</span></span>
      <span style="font-size:10px;background:var(--primary);color:#fff;padding:1px 6px;border-radius:8px;">${countAdded}/${items.length} 挂载</span>
    `;
    group.appendChild(header);

    if (isOpen) {
      const contentDiv = document.createElement('div');
      contentDiv.className = 'category-content';
      contentDiv.style.cssText = 'padding:6px;display:flex;flex-direction:column;gap:6px;';

      items.forEach(item => {
        const isAdded = activeWidgets.includes(item.id);
        const card = document.createElement('div');
        card.className = 'library-card';
        card.draggable = true;
        card.ondragstart = (e) => handleLibraryDragStart(e, item.id);

        card.innerHTML = `
          <div style="display:flex;align-items:center;justify-content:space-between;">
            <span style="font-weight:800;font-size:13px;color:#1d1d1f;">${item.icon} ${item.name}</span>
            <button type="button" class="btn" onclick="addWidgetToCanvas('${item.id}')" 
                    style="font-size:11px;padding:2px 8px;${isAdded ? 'background:#e8e8ed;color:#94a3b8;cursor:default;' : 'background:var(--primary);color:#fff;'}" 
                    ${isAdded ? 'disabled' : ''}>${isAdded ? '已挂载' : '+ 放置'}</button>
          </div>
          <span style="font-size:11px;color:var(--text-muted);">${item.badge}</span>
        `;
        contentDiv.appendChild(card);
      });
      group.appendChild(contentDiv);
    }

    library.appendChild(group);
  });
}

function renderCanvasWidgets() {
  const canvas = document.getElementById('spatial-canvas');
  if (!canvas) return;
  canvas.innerHTML = '';

  if (activeWidgets.length === 0) {
    activeWidgets = ["yuanbao", "doubao", "kimi", "qianwen", "grok", "perplexity", "zai"];
    saveWidgetState();
  }

  activeWidgets.forEach((id, idx) => {
    const info = AVAILABLE_WIDGET_TYPES[id] || { id, name: id, icon: "🧩", badge: "组件" };
    const pos = widgetPositions[id] || {
      x: 30 + (idx % 3) * 440,
      y: 30 + Math.floor(idx / 3) * 430,
      w: 420,
      h: 400
    };

    const widget = document.createElement('div');
    widget.className = 'spatial-widget';
    widget.dataset.id = id;
    widget.style.cssText = `left:${pos.x}px;top:${pos.y}px;width:${pos.w}px;height:${pos.h}px;`;

    let bodyHTML = '';
    if (info.type === 'search') {
      bodyHTML = `<div class="node-body" id="body-${id}">等待发起搜索…</div>`;
    }

    widget.innerHTML = `
      <div class="widget-head" onmousedown="initWidgetDrag(event, '${id}')" ontouchstart="initWidgetTouchDrag(event, '${id}')">
        <div class="widget-title">${info.icon} ${info.name} <span class="widget-badge">${info.badge}</span></div>
        <div class="widget-actions">
          <button type="button" class="icon-btn" onclick="removeWidgetFromCanvas('${id}')" title="移除组件">✕</button>
        </div>
      </div>
      <div class="widget-body">${bodyHTML}</div>
      <div class="widget-foot">
        <span id="status-${id}">就绪</span>
        <span>↘ 手指/鼠标拉伸右下角改变形状大小</span>
      </div>
    `;

    if (window.ResizeObserver) {
      const ro = new ResizeObserver(entries => {
        for (let entry of entries) {
          const w = Math.round(entry.contentRect.width);
          const h = Math.round(entry.contentRect.height);
          if (widgetPositions[id]) {
            widgetPositions[id].w = w;
            widgetPositions[id].h = h;
            saveWidgetPositions();
          }
        }
      });
      ro.observe(widget);
    }

    canvas.appendChild(widget);
  });

  renderWidgetLibrary();
  updateCanvasTransform();
  restoreCanvasSearchResults();
}

/* ---------- 拖拽组件 Card ---------- */
function initWidgetDrag(ev, id) {
  if (isCanvasLocked) return;
  ev.stopPropagation();
  const widget = document.querySelector(`.spatial-widget[data-id="${id}"]`);
  if (!widget) return;

  document.querySelectorAll('.spatial-widget').forEach(w => w.classList.remove('active-widget'));
  widget.classList.add('active-widget');

  const startX = ev.clientX;
  const startY = ev.clientY;
  const initialLeft = widget.offsetLeft;
  const initialTop = widget.offsetTop;

  function onMouseMove(e) {
    const dx = (e.clientX - startX) / canvasZoomScale;
    const dy = (e.clientY - startY) / canvasZoomScale;
    const newLeft = initialLeft + dx;
    const newTop = initialTop + dy;
    widget.style.left = `${newLeft}px`;
    widget.style.top = `${newTop}px`;
    
    if (!widgetPositions[id]) widgetPositions[id] = { w: 420, h: 400 };
    widgetPositions[id].x = Math.round(newLeft);
    widgetPositions[id].y = Math.round(newTop);
  }

  function onMouseUp() {
    saveWidgetPositions();
    window.removeEventListener('mousemove', onMouseMove);
    window.removeEventListener('mouseup', onMouseUp);
  }

  window.addEventListener('mousemove', onMouseMove);
  window.addEventListener('mouseup', onMouseUp);
}

function initWidgetTouchDrag(ev, id) {
  if (isCanvasLocked) return;
  if (ev.touches.length !== 1) return;
  ev.stopPropagation();

  const widget = document.querySelector(`.spatial-widget[data-id="${id}"]`);
  if (!widget) return;

  document.querySelectorAll('.spatial-widget').forEach(w => w.classList.remove('active-widget'));
  widget.classList.add('active-widget');

  const touch = ev.touches[0];
  const startX = touch.clientX;
  const startY = touch.clientY;
  const initialLeft = widget.offsetLeft;
  const initialTop = widget.offsetTop;

  function onTouchMove(e) {
    if (e.touches.length !== 1) return;
    const t = e.touches[0];
    const dx = (t.clientX - startX) / canvasZoomScale;
    const dy = (t.clientY - startY) / canvasZoomScale;
    const newLeft = initialLeft + dx;
    const newTop = initialTop + dy;
    widget.style.left = `${newLeft}px`;
    widget.style.top = `${newTop}px`;

    if (!widgetPositions[id]) widgetPositions[id] = { w: 420, h: 400 };
    widgetPositions[id].x = Math.round(newLeft);
    widgetPositions[id].y = Math.round(newTop);
  }

  function onTouchEnd() {
    saveWidgetPositions();
    window.removeEventListener('touchmove', onTouchMove);
    window.removeEventListener('touchend', onTouchEnd);
  }

  window.addEventListener('touchmove', onTouchMove);
  window.addEventListener('touchend', onTouchEnd);
}

function handleLibraryDragStart(ev, widgetId) {
  ev.dataTransfer.setData('text/plain', widgetId);
}
function handleCanvasDragOver(ev) { ev.preventDefault(); }
function handleCanvasDrop(ev) {
  ev.preventDefault();
  const id = ev.dataTransfer.getData('text/plain');
  if (id && AVAILABLE_WIDGET_TYPES[id]) addWidgetToCanvas(id);
}

function addWidgetToCanvas(id) {
  if (!activeWidgets.includes(id)) {
    activeWidgets.push(id);
    saveWidgetState();
    renderCanvasWidgets();
  }
}

function addAllSearchEnginesToCanvas() {
  const searchIds = ['yuanbao', 'doubao', 'kimi', 'qianwen', 'metaso', 'grok', 'perplexity', 'zai'];
  searchIds.forEach(id => {
    if (!activeWidgets.includes(id)) {
      activeWidgets.push(id);
    }
  });
  saveWidgetState();
  renderCanvasWidgets();
  autoAlignWidgets();
}

function removeWidgetFromCanvas(id) {
  if (isCanvasLocked) return;
  activeWidgets = activeWidgets.filter(item => item !== id);
  saveWidgetState();
  renderCanvasWidgets();
}

function clearAllCanvasWidgets() {
  if (isCanvasLocked) return;
  if (confirm('确定要清空画布上的所有组件吗？')) {
    activeWidgets = [];
    saveWidgetState();
    renderCanvasWidgets();
  }
}

function autoAlignWidgets() {
  if (isCanvasLocked) return;
  activeWidgets.forEach((id, idx) => {
    widgetPositions[id] = {
      x: 30 + (idx % 3) * 440,
      y: 30 + Math.floor(idx / 3) * 430,
      w: widgetPositions[id] ? widgetPositions[id].w : 420,
      h: widgetPositions[id] ? widgetPositions[id].h : 400
    };
  });
  saveWidgetPositions();
  resetCanvasTransform();
  renderCanvasWidgets();
}

function saveWidgetState() {
  localStorage.setItem('spatial_widgets_state_v4', JSON.stringify(activeWidgets));
}
function saveWidgetPositions() {
  localStorage.setItem('spatial_widgets_pos_v4', JSON.stringify(widgetPositions));
}

      </div>
      <div style="display:flex;gap:6px;">
        <button type="button" class="btn" style="padding:5px 12px;font-size:12px;" onclick="loadCompositionPreset('${preset.id}')">⚡ 切换加载</button>
        ${preset.isUserSaved ? `<button type="button" class="icon-btn" onclick="deleteUserPreset('${preset.id}')" title="删除预设">✕</button>` : ''}
      </div>
    `;
    container.appendChild(card);
  });
}

function saveNewPreset() {
  const nameInput = document.getElementById('preset-name-input');
  const name = nameInput ? nameInput.value.trim() : '';
  if (!name) { alert('请输入预设视图名称'); return; }

  const userPresets = JSON.parse(localStorage.getItem('spatial_canvas_presets_v1') || '{}');
  const presetId = 'custom_' + Date.now();
  userPresets[presetId] = {
    id: presetId,
    name: "📁 " + name,
    isUserSaved: true,
    activeWidgets: [...activeWidgets],
    widgetPositions: JSON.parse(JSON.stringify(widgetPositions)),
    zoomScale: canvasZoomScale,
    panX: canvasPanX,
    panY: canvasPanY
  };

  localStorage.setItem('spatial_canvas_presets_v1', JSON.stringify(userPresets));
  if (nameInput) nameInput.value = '';
  alert('✅ 成功保存组合视图: ' + name);
  renderPresetList();
}

function deleteUserPreset(presetId) {
  const userPresets = JSON.parse(localStorage.getItem('spatial_canvas_presets_v1') || '{}');
  if (userPresets[presetId]) {
    delete userPresets[presetId];
    localStorage.setItem('spatial_canvas_presets_v1', JSON.stringify(userPresets));
    renderPresetList();
  }
}

function loadCompositionPreset(presetId) {
  const userPresets = JSON.parse(localStorage.getItem('spatial_canvas_presets_v1') || '{}');
  const allPresets = { ...BUILTIN_PRESETS, ...userPresets };
  const target = allPresets[presetId];

  if (!target) return;
  activeWidgets = [...target.activeWidgets];
  if (target.widgetPositions) widgetPositions = JSON.parse(JSON.stringify(target.widgetPositions));
  if (target.zoomScale) canvasZoomScale = target.zoomScale;
  if (target.panX !== undefined) canvasPanX = target.panX;
  if (target.panY !== undefined) canvasPanY = target.panY;

  saveWidgetState();
  saveWidgetPositions();
  renderCanvasWidgets();
  updateCanvasTransform();
  closePresetModal();
}

/* ==========================================================================
   全局搜索与 AI 交互 (包含标准 Markdown 黑色排版规范渲染)
   ========================================================================== */

function triggerGlobalCanvasSearch() {
  const input = document.getElementById('global-prompt-input');
  const prompt = input ? input.value.trim() : '';
  if (!prompt) { alert('请输入搜索问题'); return; }

  let searchEngineIds = activeWidgets.filter(id => AVAILABLE_WIDGET_TYPES[id] && AVAILABLE_WIDGET_TYPES[id].type === 'search');
  if (searchEngineIds.length === 0) {
    const defaultSearchEngines = ['yuanbao', 'doubao', 'kimi', 'qianwen', 'metaso', 'grok', 'perplexity', 'zai'];
    defaultSearchEngines.forEach(id => {
      if (!activeWidgets.includes(id)) activeWidgets.push(id);
    });
    saveWidgetState();
    renderCanvasWidgets();
    autoAlignWidgets();
    searchEngineIds = activeWidgets.filter(id => AVAILABLE_WIDGET_TYPES[id] && AVAILABLE_WIDGET_TYPES[id].type === 'search');
  }

  if (searchEngineIds.length > 0) {
    searchEngineIds.forEach(id => {
      const eng = AVAILABLE_WIDGET_TYPES[id];
      const body = document.getElementById('body-' + id);
      const status = document.getElementById('status-' + id);
      if (body) body.innerHTML = `正在连接 ${eng.name}…<span class="cursor-blink"></span>`;
      if (status) status.innerText = '检索中…';
    });

    const currentResults = {};
    const enginesParam = encodeURIComponent(searchEngineIds.join(','));
    const es = new EventSource('/api/unified_stream?prompt=' + encodeURIComponent(prompt) + '&engines=' + enginesParam);

    es.onmessage = ev => {
      if (ev.data === '[DONE]') {
        es.close();
        searchEngineIds.forEach(id => {
          const b = document.getElementById('body-' + id);
          const c = b ? b.querySelector('.cursor-blink') : null;
          if (c) c.remove();
        });
        saveSearchHistory(prompt, currentResults);
        saveCanvasSearchResults(prompt, currentResults);
        return;
      }
      try {
        const d = JSON.parse(ev.data);
        // #50: handle __summary__ event
        if (d.id === '__summary__' && d.answer) {
          renderSummaryCard(d.answer);
          return;
        }
        if (d.id && searchEngineIds.includes(d.id)) {
          const b = document.getElementById('body-' + d.id);
          const s = document.getElementById('status-' + d.id);
          if (d.status === 'progress' && b) {
            b.innerText = d.msg;
          } else if (d.status === 'unconnected' && b) {
            // #50: show unbound state
            b.innerHTML = '<div style="text-align:center;padding:20px;color:#86868b;">⚪ 未绑定<br><span style="font-size:12px;">需 setup_engines.py 绑定 + 登录</span></div>';
            if (s) s.innerText = '未绑定';
            currentResults[d.id] = { answer: '', html: b.innerHTML, statusText: '未绑定' };
          } else if ((d.status === 'done' || d.status === 'ok') && b) {
            if (d.answer || d.thinking) {
              const answerText = d.answer || d.text || '';
              const refLinks = d.ref_links || [];
              b.innerHTML = renderResultHTML(d.thinking, answerText, d.answer_html || '', refLinks, d.id);
              const statusText = d.refs ? `完成 · 引用 ${d.refs} 条` : '完成';
              currentResults[d.id] = { answer: answerText, html: b.innerHTML, statusText: statusText };
              if (s) s.innerText = statusText;
            }
          }
        }
      } catch(e){}
    };
    es.onerror = () => es.close();
  }
}

function escapeHTML(str) {
  return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function formatInline(str) {
  if (!str) return '';
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/\*\*(.*?)\*\*/g, '<strong style="color:#000 !important;font-weight:800 !important;">$1</strong>')
    .replace(/\*(.*?)\*/g, '<em style="color:#334155 !important;">$1</em>')
    .replace(/`([^`]+)`/g, '<code style="background:#f5f5f7 !important;color:#1d1d1f !important;padding:2px 6px;border-radius:4px;font-family:Consolas,monospace;font-size:13px;">$1</code>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener" style="color:#0071e3 !important;font-weight:600;text-decoration:underline;">$1 ↗</a>');
}

function safeMarkdownParse(str) {
  if (!str) return '';
  if (window.marked && typeof window.marked.parse === 'function') {
    try {
      return window.marked.parse(str);
    } catch(e){}
  }

  let src = str.replace(/\r\n/g, '\n');
  let html = '';
  let lines = src.split('\n');
  let inList = false, listType = '';
  let inCode = false, codeBuf = '';

  for (let i = 0; i < lines.length; i++) {
    let line = lines[i];
    
    if (line.trim().startsWith('```')) {
      if (inCode) {
        html += `<pre style="background:#f5f5f7;padding:10px 12px;border-radius:8px;overflow-x:auto;font-family:Consolas,monospace;font-size:13px;margin:10px 0;color:#1d1d1f;"><code>${escapeHTML(codeBuf)}</code></pre>`;
        codeBuf = '';
        inCode = false;
      } else {
        inCode = true;
      }
      continue;
    }
    if (inCode) {
      codeBuf += (codeBuf ? '\n' : '') + line;
      continue;
    }

    let trimmed = line.trim();
    if (!trimmed) {
      if (inList) { html += (listType === 'ul' ? '</ul>' : '</ol>'); inList = false; }
      continue;
    }

    if (trimmed.startsWith('# ')) {
      if (inList) { html += (listType === 'ul' ? '</ul>' : '</ol>'); inList = false; }
      html += `<h1 style="font-size:18px;font-weight:800;color:#1d1d1f;margin:16px 0 8px 0;line-height:1.4;">${formatInline(trimmed.slice(2))}</h1>`;
      continue;
    }
    if (trimmed.startsWith('## ')) {
      if (inList) { html += (listType === 'ul' ? '</ul>' : '</ol>'); inList = false; }
      html += `<h2 style="font-size:16px;font-weight:800;color:#1d1d1f;margin:14px 0 6px 0;line-height:1.4;">${formatInline(trimmed.slice(3))}</h2>`;
      continue;
    }
    if (trimmed.startsWith('### ')) {
      if (inList) { html += (listType === 'ul' ? '</ul>' : '</ol>'); inList = false; }
      html += `<h3 style="font-size:15px;font-weight:700;color:#1d1d1f;margin:12px 0 4px 0;line-height:1.4;">${formatInline(trimmed.slice(4))}</h3>`;
      continue;
    }
    if (trimmed.startsWith('#### ')) {
      if (inList) { html += (listType === 'ul' ? '</ul>' : '</ol>'); inList = false; }
      html += `<h4 style="font-size:14px;font-weight:700;color:#1d1d1f;margin:10px 0 4px 0;line-height:1.4;">${formatInline(trimmed.slice(5))}</h4>`;
      continue;
    }

    let isUl = /^[*\-+]\s+/.test(trimmed);
    let isOl = /^\d+\.\s+/.test(trimmed);

    if (isUl || isOl) {
      let type = isUl ? 'ul' : 'ol';
      let content = isUl ? trimmed.replace(/^[*\-+]\s+/, '') : trimmed.replace(/^\d+\.\s+/, '');
      if (!inList) {
        inList = true;
        listType = type;
        html += type === 'ul' ? '<ul style="padding-left:22px;margin:8px 0;color:#1d1d1f;">' : '<ol style="padding-left:22px;margin:8px 0;color:#1d1d1f;">';
      }
      html += `<li style="margin-bottom:6px;line-height:1.7;">${formatInline(content)}</li>`;
      continue;
    }

    if (inList) {
      html += (listType === 'ul' ? '</ul>' : '</ol>');
      inList = false;
    }

    if (trimmed.startsWith('> ')) {
      html += `<blockquote style="border-left:4px solid #0071e3;padding:6px 12px;background:#f8fafc;color:#334155;margin:10px 0;border-radius:0 6px 6px 0;">${formatInline(trimmed.slice(2))}</blockquote>`;
      continue;
    }

    html += `<p style="margin-bottom:10px;line-height:1.75;color:#1d1d1f;">${formatInline(line)}</p>`;
  }

  if (inList) html += (listType === 'ul' ? '</ul>' : '</ol>');
  return html;
}

function renderResultHTML(thinking, answer, answerHTML, refLinks, engineId) {
  let html = '';
  if (thinking) {
    html += `<details style="background:#f8fafc;border:1px solid #e8e8ed;border-radius:8px;padding:8px 12px;margin-bottom:12px;">` +
      `<summary style="font-size:12px;font-weight:700;color:var(--text-muted);cursor:pointer;">💡 展开思考过程</summary>` +
      `<div style="font-size:13px;color:#475569;margin-top:6px;white-space:pre-wrap;">${thinking}</div></details>`;
  }

  let content = '';
  if (answerHTML && answerHTML.trim().length > 10) {
    content = answerHTML;
  } else if (answer && answer.trim().length > 0) {
    content = safeMarkdownParse(answer);
  } else {
    content = '暂无详细回答';
  }

  html += `<div class="formatted-answer" style="color:#1d1d1f;font-size:14px;line-height:1.75;">${content}</div>`;

  // #50: ref_links source chips
  if (refLinks && refLinks.length > 0) {
    html += '<div style="margin-top:12px;padding-top:10px;border-top:1px solid #e8e8ed;">';
    html += '<div style="font-size:11px;font-weight:700;color:#86868b;margin-bottom:6px;">🔗 引用来源</div>';
    html += '<div style="display:flex;flex-wrap:wrap;gap:4px;">';
    for (var i = 0; i < refLinks.length; i++) {
      var link = refLinks[i];
      var title = link.title || link.url || '';
      if (title.length > 40) title = title.slice(0, 37) + '...';
      html += '<a href="' + (link.url || '#') + '" target="_blank" rel="noopener" style="display:inline-block;padding:3px 8px;border-radius:12px;background:#f0f4ff;border:1px solid #d0d8f0;color:#4a5a8a;font-size:11px;text-decoration:none;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="' + (link.title || link.url || '') + '">' + title + ' ↗</a>';
    }
    html += '</div></div>';
  }

  // #50: retry button
  if (engineId) {
    html += '<div style="margin-top:10px;text-align:right;">';
    html += '<button type="button" onclick="retrySingleEngine('' + engineId + '')" style="padding:3px 10px;border-radius:8px;border:1px solid #d2d2d7;background:#f8fafc;cursor:pointer;font-size:11px;color:#1d1d1f;">🔄 重问</button>';
    html += '</div>';
  }

  return html;
}

function renderSummaryCard(summary) {
  // #50: render __summary__ event as a summary card at top of canvas
  var existing = document.getElementById('summary-card');
  if (existing) existing.remove();

  var card = document.createElement('div');
  card.id = 'summary-card';
  card.className = 'spatial-widget';
  card.style.cssText = 'left:30px;top:30px;width:90%;max-width:700px;height:auto;min-height:80px;z-index:50;border:2px solid #0071e3;box-shadow:0 4px 20px rgba(0,113,227,0.15);';

  card.innerHTML = '<div class="widget-head" style="cursor:default;background:linear-gradient(135deg,#0071e3,#005bb5);color:#fff;border-radius:10px 10px 0 0;">'
    + '<div class="widget-title">🧊 综合摘要 <span style="font-size:11px;font-weight:400;opacity:0.8;">AI 多源汇总</span></div>'
    + '<div class="widget-actions">'
    + '<button type="button" class="icon-btn" onclick="this.closest(\'.spatial-widget\').remove()" style="color:#fff;opacity:0.8;" title="关闭综合卡">✕</button>'
    + '</div></div>'
    + '<div class="widget-body" style="padding:16px 20px;font-size:14px;line-height:1.75;color:#1d1d1f;">' + safeMarkdownParse(summary) + '</div>';

  document.getElementById('spatial-canvas').prepend(card);
}

function retrySingleEngine(engineId) {
  // #50: retry a single engine search
  var prompt = document.getElementById('global-prompt-input').value.trim();
  if (!prompt) return;

  var body = document.getElementById('body-' + engineId);
  var status = document.getElementById('status-' + engineId);
  if (body) body.innerHTML = '正在重新检索…<span class="cursor-blink"></span>';
  if (status) status.innerText = '检索中…';

  var es = new EventSource('/api/unified_stream?prompt=' + encodeURIComponent(prompt) + '&engines=' + encodeURIComponent(engineId));
  es.onmessage = function(ev) {
    if (ev.data === '[DONE]') {
      es.close();
      var b = document.getElementById('body-' + engineId);
      var c = b ? b.querySelector('.cursor-blink') : null;
      if (c) c.remove();
      return;
    }
    try {
      var d = JSON.parse(ev.data);
      if (d.id === engineId && (d.status === 'done' || d.status === 'ok') && body) {
        if (d.answer || d.thinking) {
          var refLinks = d.ref_links || [];
          body.innerHTML = renderResultHTML(d.thinking, d.answer || d.text || '', d.answer_html || '', refLinks, engineId);
          if (status) status.innerText = d.refs ? '完成 · 引用 ' + d.refs + ' 条' : '完成';
        }
      }
    } catch(e) {}
  };
  es.onerror = function() { es.close(); };
}

function saveCanvasSearchResults(prompt, resultsMap) {
  const data = {
    prompt: prompt,
    results: resultsMap,
    timestamp: Date.now()
  };
  localStorage.setItem('spatial_canvas_last_search_v2', JSON.stringify(data));
}

function restoreCanvasSearchResults() {
  const raw = localStorage.getItem('spatial_canvas_last_search_v2');
  if (!raw) return;
  try {
    const data = JSON.parse(raw);
    if (data && data.prompt) {
      const input = document.getElementById('global-prompt-input');
      if (input && !input.value) input.value = data.prompt;
    }
    if (data && data.results) {
      Object.entries(data.results).forEach(([id, item]) => {
        const body = document.getElementById('body-' + id);
        const status = document.getElementById('status-' + id);
        if (body && item.html) {
          body.innerHTML = item.html;
        }
        if (status && item.statusText) {
          status.innerText = item.statusText;
        }
      });
    }
  } catch(e){}
}

function openHistoryModal() {
  document.getElementById('history-modal').style.display = 'flex';
  renderModalHistoryList();
}
function closeHistoryModal() {
  document.getElementById('history-modal').style.display = 'none';
}
function saveSearchHistory(query, resultsData) {
  if (!query || !query.trim()) return;
  let list = JSON.parse(localStorage.getItem('ai_search_history_v1') || '[]');
  list.unshift({ query: query.trim(), time_str: new Date().toLocaleTimeString(), results: resultsData });
  if (list.length > 20) list = list.slice(0, 20);
  localStorage.setItem('ai_search_history_v1', JSON.stringify(list));
}
function restoreHistoryItemToCanvas(item) {
  if (!item) return;
  const q = item.query || item.question || '';
  const input = document.getElementById('global-prompt-input');
  if (input && q) input.value = q;

  let resultsMap = {};

  if (item.results && typeof item.results === 'object' && Object.keys(item.results).length > 0) {
    resultsMap = item.results;
  } else if (item.answer || item.html || item.text) {
    const engineId = item.engine || 'yuanbao';
    const answerText = item.answer || item.text || '';
    const answerHTML = item.answer_html || item.html || '';
    const formatted = renderResultHTML(item.thinking || '', answerText, answerHTML);
    resultsMap[engineId] = {
      answer: answerText,
      html: formatted,
      statusText: item.refs ? `完成 · 引用 ${item.refs} 条` : '完成'
    };
  }

  Object.keys(resultsMap).forEach(id => {
    if (AVAILABLE_WIDGET_TYPES[id] && !activeWidgets.includes(id)) {
      activeWidgets.push(id);
    }
  });
  saveWidgetState();
  renderCanvasWidgets();

  saveCanvasSearchResults(q, resultsMap);
  restoreCanvasSearchResults();
  closeHistoryModal();
}

async function renderModalHistoryList() {
  const listEl = document.getElementById('modal-history-list');
  if (!listEl) return;
  listEl.innerHTML = '<div style="color:var(--text-muted);font-size:13px;">加载中…</div>';
  let list = JSON.parse(localStorage.getItem('ai_search_history_v1') || '[]');
  try {
    const res = await fetch('/api/history');
    if (res.ok) {
      const data = await res.json();
      if (data && data.history && data.history.length) list = data.history;
    }
  } catch(e){}
  listEl.innerHTML = '';
  if (list.length === 0) {
    listEl.innerHTML = '<div style="color:var(--text-muted);font-size:13px;">暂无历史记录</div>';
    return;
  }
  list.forEach(item => {
    const div = document.createElement('div');
    div.style.cssText = 'background:#fff;border:1px solid var(--card-border);border-radius:8px;padding:10px;cursor:pointer;';
    const q = item.query || item.question || '历史搜索';
    div.innerHTML = `<div style="font-weight:700;font-size:14px;margin-bottom:4px;">🔍 ${q}</div><div style="font-size:11px;color:var(--text-muted);">时间: ${item.time_str || (item.created_at || '').slice(11,16)}</div>`;
    
    div.onclick = () => {
      const detailEl = document.getElementById('modal-history-detail');
      if (detailEl) {
        window._current_selected_history_item = item;
        const answerText = item.answer || (item.results ? JSON.stringify(item.results, null, 2) : '');
        detailEl.innerHTML = `
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;border-bottom:1.5px solid var(--card-border);padding-bottom:8px;">
            <div style="font-weight:800;font-size:15px;color:#1d1d1f;">🔍 ${q}</div>
            <button type="button" class="btn" style="font-size:12px;padding:6px 14px;background:var(--primary);" onclick="restoreHistoryItemToCanvas(window._current_selected_history_item)">⚡ 一键还原到画布</button>
          </div>
          <div style="font-size:13px;line-height:1.7;color:#1d1d1f;white-space:pre-wrap;background:#fff;padding:12px;border-radius:8px;border:1px solid var(--card-border);">${answerText || '历史记录详细文本已保留'}</div>
        `;
      }
    };
    listEl.appendChild(div);
  });
}

window.onload = () => {
  renderCanvasWidgets();
  updateCanvasTransform();
};
</script>

    brand.style.transform='rotate(360deg) scale(1.06)';
    setTimeout(()=>{brand.style.transition='';brand.style.transform='';},620);
  });

  /* kawaii 点击爱心粒子 */
  document.addEventListener('click',e=>{
    if(document.documentElement.getAttribute('data-skin')!=='kawaii')return;
    const h=document.createElement('span');
    h.className='skin-heart';
    h.textContent=['❤️','💖','🌸','✨'][Math.floor(Math.random()*4)];
    h.style.left=(e.clientX-9)+'px';h.style.top=(e.clientY-14)+'px';
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),1050);
  });

  /* 初始化（默认 apple） */
  let cur='apple';
  try{cur=localStorage.getItem(KEY)||'apple';}catch(e){}
  window.skinApply(cur);
})();
</script>
</body>
</html>
