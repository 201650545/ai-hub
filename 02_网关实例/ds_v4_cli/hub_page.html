<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Universal AI Hub — 空间无限画布控制台</title>
<style>
:root {
  --bg-canvas: #f1f3f8;
  --bg-glass: rgba(255, 255, 255, 0.92);
  --bg-card: #ffffff;
  --text-main: #0f172a;
  --text-muted: #64748b;
  --hairline: #cbd5e1;
  --card-border: #e2e8f0;
  --primary: #0052cc;
  --primary-hover: #0041a3;
  --green: #16a34a;
  --amber: #d97706;
  --red: #dc2626;
  --shadow-sm: 0 4px 12px rgba(15, 23, 42, 0.05);
  --shadow-lg: 0 12px 32px rgba(15, 23, 42, 0.12);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
  background: var(--bg-canvas);
  color: var(--text-main);
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

/* ---------- 顶部全域悬浮控制栏 ---------- */
.top-nav {
  position: fixed;
  top: 14px;
  left: 16px;
  right: 16px;
  height: 60px;
  z-index: 100;
  background: rgba(255, 255, 255, 0.94);
  backdrop-filter: saturate(180%) blur(16px);
  -webkit-backdrop-filter: saturate(180%) blur(16px);
  border: 1.5px solid var(--card-border);
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  box-shadow: var(--shadow-sm);
}

.brand {
  font-size: 17px;
  font-weight: 800;
  color: #000;
  display: flex;
  align-items: center;
  gap: 8px;
}
.brand span {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
  background: #e2e8f0;
  padding: 3px 8px;
  border-radius: 6px;
}

.global-search-box {
  flex: 1;
  max-width: 620px;
  margin: 0 20px;
  display: flex;
  gap: 10px;
}
.global-search-box input {
  flex: 1;
  padding: 10px 18px;
  border-radius: 980px;
  border: 1.5px solid var(--hairline);
  font-size: 15px;
  font-weight: 600;
  outline: none;
  background: #fff;
  transition: all 0.15s;
}
.global-search-box input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(0, 82, 204, 0.12);
}

.btn {
  background: #000;
  color: #fff;
  border: none;
  padding: 10px 22px;
  border-radius: 980px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s;
  white-space: nowrap;
}
.btn:hover { background: #222; transform: translateY(-1px); }
.btn-secondary {
  background: #f1f5f9;
  color: var(--text-main);
  border: 1.5px solid var(--card-border);
}
.btn-secondary:hover { background: #e2e8f0; }

.top-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}
.endpoint-tag {
  font-size: 13px;
  font-weight: 700;
  color: var(--primary);
  background: rgba(0, 82, 204, 0.08);
  padding: 6px 12px;
  border-radius: 8px;
  cursor: pointer;
  user-select: none;
}
.endpoint-tag:hover { background: rgba(0, 82, 204, 0.15); }

/* ---------- 左侧可折叠功能组件 Dock 抽屉 ---------- */
.left-dock {
  position: fixed;
  top: 86px;
  left: 16px;
  bottom: 16px;
  width: 280px;
  z-index: 90;
  background: rgba(255, 255, 255, 0.94);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1.5px solid var(--card-border);
  border-radius: 18px;
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  box-shadow: var(--shadow-sm);
  transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}
.left-dock.collapsed {
  transform: translateX(-310px);
}
.dock-toggle-btn {
  position: absolute;
  right: -36px;
  top: 18px;
  width: 34px;
  height: 34px;
  background: #fff;
  border: 1.5px solid var(--card-border);
  border-radius: 0 10px 10px 0;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: var(--shadow-sm);
  font-size: 14px;
}

.dock-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-bottom: 10px;
  border-bottom: 1.5px solid var(--card-border);
}
.dock-header h3 { font-size: 15px; font-weight: 800; }

.widget-library {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding-right: 2px;
}
.library-card {
  background: #fff;
  border: 1.5px solid var(--card-border);
  border-radius: 12px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  cursor: grab;
  transition: all 0.2s;
  user-select: none;
}
.library-card:hover {
  border-color: var(--primary);
  box-shadow: 0 4px 12px rgba(0,82,204,0.08);
  transform: translateY(-1px);
}

/* ---------- 无限空间画布 Viewport & Canvas ---------- */
/* ---------- 无限空间画布 Viewport & Canvas ---------- */
#canvas-viewport {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background-color: #f1f5f9;
  background-image: radial-gradient(#cbd5e1 1.5px, transparent 1.5px);
  background-size: 28px 28px;
  background-position: 0 0;
  cursor: grab;
}
#canvas-viewport:active { cursor: grabbing; }

#spatial-canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 0;
  height: 0;
  overflow: visible;
  transform-origin: 0 0;
  pointer-events: none;
}


/* ---------- 画布上的功能组件 Widget Card ---------- */
.spatial-widget {
  position: absolute;
  pointer-events: auto;
  background: var(--bg-card);

  border: 1.5px solid var(--card-border);
  border-radius: 18px;
  box-shadow: var(--shadow-lg);
  display: flex;
  flex-direction: column;
  resize: both;
  overflow: hidden;
  min-width: 320px;
  min-height: 240px;
  user-select: text;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.spatial-widget:focus-within, .spatial-widget.active-widget {
  border-color: var(--primary);
  box-shadow: 0 12px 36px rgba(0, 82, 204, 0.15);
}

.widget-head {
  padding: 12px 16px;
  background: #fafbfc;
  border-bottom: 1.5px solid var(--card-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: move;
  user-select: none;
}
.widget-title {
  font-size: 15px;
  font-weight: 800;
  display: flex;
  align-items: center;
  gap: 8px;
}
.widget-badge {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  background: var(--bg-canvas);
  padding: 2px 7px;
  border-radius: 6px;
}
.widget-actions {
  display: flex;
  gap: 6px;
}
.icon-btn {
  background: transparent;
  border: none;
  color: var(--text-muted);
  font-size: 15px;
  cursor: pointer;
  padding: 2px 6px;
  border-radius: 6px;
}
.icon-btn:hover { background: #e2e8f0; color: #000; }

.widget-body {
  flex: 1;
  padding: 16px;
  overflow-y: auto;
  font-size: 15px;
  line-height: 1.75;
}

.widget-foot {
  padding: 8px 14px;
  border-top: 1.5px solid var(--card-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  color: var(--text-muted);
  font-weight: 600;
  user-select: none;
  background: #fafbfc;
}

/* ---------- 浮动画布视图控制 Toolbar ---------- */
.canvas-controls-toolbar {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 100;
  background: rgba(255, 255, 255, 0.94);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1.5px solid var(--card-border);
  border-radius: 14px;
  padding: 8px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: var(--shadow-lg);
  user-select: none;
}
.zoom-badge {
  font-size: 14px;
  font-weight: 800;
  color: var(--text-main);
  min-width: 46px;
}

/* ---------- Markdown & 结果展示 ---------- */
.node-body table{width:100%;border-collapse:collapse;margin:12px 0;font-size:14px;border:1.5px solid var(--hairline)}
.node-body th{background:#eef1f6;color:#000;font-weight:800;border:1.5px solid var(--hairline);padding:8px 12px;text-align:left}
.node-body td{border:1px solid var(--hairline);padding:8px 12px;background:#fff;font-weight:500;color:#000}
.node-body code{background:#eef1f6;color:var(--primary);padding:2px 6px;border-radius:4px;font-family:Consolas,monospace;font-size:13px;font-weight:700}
.node-body pre{background:#1e1e24;color:#fff;padding:14px;border-radius:10px;overflow-x:auto;margin:12px 0}
.node-body pre code{background:transparent;color:#fff;padding:0}
.cursor-blink{display:inline-block;width:7px;height:15px;background:var(--primary);margin-left:3px;vertical-align:middle;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* ---------- 弹窗 Modal ---------- */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; width: 100vw; height: 100vh;
  background: rgba(0,0,0,0.4);
  backdrop-filter: blur(8px);
  z-index: 1000;
  align-items: center;
  justify-content: center;
}
</style>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

<!-- 1. 顶部悬浮控制与全域搜索 Bar -->
<header class="top-nav">
  <div class="brand">
    🌐 Universal <b>AI Spatial Canvas</b> <span>全屏无限画布工作区</span>
  </div>

  <div class="global-search-box">
    <input id="global-prompt-input" type="text" placeholder="输入任意问题，一键向画布中所有 AI 发起并发对比搜索…">
    <button type="button" class="btn" onclick="triggerGlobalCanvasSearch()">🚀 组合全域搜索</button>
  </div>

  <div class="top-actions">
    <div class="endpoint-tag" onclick="copyEndpoint()" title="点击复制 API Base URL">📡 http://localhost:3000/v1</div>
    <button type="button" class="btn btn-secondary" onclick="openHistoryModal()">📜 搜索历史</button>
  </div>
</header>

<!-- 2. 左侧可折叠功能组件 Dock 抽屉 -->
<aside class="left-dock" id="left-dock">
  <div class="dock-toggle-btn" onclick="toggleDock()" title="展开/收起组件库">◀</div>
  
  <div class="dock-header">
    <h3>🧩 功能组件库</h3>
    <span style="font-size:12px;color:var(--text-muted);font-weight:600;">随意组合使用</span>
  </div>

  <div class="widget-library" id="widget-library">
    <!-- 动态加载各大 AI 引擎 + 功能 Widget 卡片 -->
  </div>
</aside>

<!-- 3. 全屏无限空间画布 Viewport -->
<main id="canvas-viewport"
      onwheel="handleCanvasWheel(event)"
      onmousedown="handleCanvasMouseDown(event)"
      ondragover="handleCanvasDragOver(event)"
      ondrop="handleCanvasDrop(event)">
  
  <!-- 无限 2D 平移缩放变换层 -->
  <div id="spatial-canvas">
    <!-- 动态挂载用户随意放置与调大调小的功能 Card -->
  </div>
</main>

<!-- 4. 浮动画布视图控制 Toolbar -->
<div class="canvas-controls-toolbar">
  <button type="button" id="hand-mode-btn" class="btn btn-secondary" style="padding:6px 14px;font-size:13px;" onclick="toggleHandMode()" title="切换抓手平移模式 (按住空格键同效)">🖐️ 抓手平移</button>
  <span class="zoom-badge" id="zoom-badge">100%</span>
  <button type="button" class="btn btn-secondary" style="padding:6px 12px;font-size:15px;" onclick="zoomCanvas(0.1)" title="放大视角">➕</button>
  <button type="button" class="btn btn-secondary" style="padding:6px 12px;font-size:15px;" onclick="zoomCanvas(-0.1)" title="缩小视角">➖</button>
  <button type="button" class="btn btn-secondary" style="padding:6px 14px;font-size:13px;" onclick="resetCanvasTransform()" title="重置视角 (0,0)">🎯 重置视角</button>
  <button type="button" class="btn btn-secondary" style="padding:6px 14px;font-size:13px;" onclick="autoAlignWidgets()" title="整齐网格对齐">📐 自动整理</button>
  <button type="button" class="btn btn-secondary" style="padding:6px 14px;font-size:13px;color:var(--red);" onclick="clearAllCanvasWidgets()" title="清空画布组件">🧹 清空画布</button>
</div>


<!-- 5. 搜索历史 Modal 弹窗 -->
<div id="history-modal" class="modal-overlay">
  <div class="spatial-widget" style="width:82%;max-width:1100px;height:80vh;position:relative;resize:none;">
    <div class="widget-head" style="cursor:default;">
      <div class="widget-title">📜 AI 搜索历史沉淀记录</div>
      <button type="button" class="icon-btn" onclick="closeHistoryModal()">✕</button>
    </div>
    <div class="widget-body" style="display:flex;gap:18px;padding:18px;">
      <div id="modal-history-list" style="width:34%;border-right:1.5px solid var(--hairline);padding-right:14px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;"></div>
      <div id="modal-history-detail" style="flex:1;overflow-y:auto;background:var(--bg-canvas);border-radius:12px;padding:20px;display:flex;flex-direction:column;">
        <div style="color:var(--text-muted);font-size:14px;margin:auto;">👈 选择左侧记录查看详情</div>
      </div>
    </div>
  </div>
</div>

<script>
/* ==========================================================================
   全屏无限 Spatial Canvas 引擎
   ========================================================================== */

const AVAILABLE_WIDGET_TYPES = {
  "yuanbao": { id: "yuanbao", type: "search", name: "腾讯元宝 AI 搜", icon: "🐧", badge: "微信公众号 + 腾讯全网" },
  "doubao": { id: "doubao", type: "search", name: "字节豆包 AI 搜", icon: "🧩", badge: "字节抖音全网实时" },
  "kimi": { id: "kimi", type: "search", name: "月之暗面 Kimi", icon: "🌙", badge: "200万字长上下文" },
  "qianwen": { id: "qianwen", type: "search", name: "通义千问智搜", icon: "🎈", badge: "阿里通义全网检索" },
  "grok": { id: "grok", type: "search", name: "xAI Grok", icon: "🤖", badge: "Grok 实时全网智搜" },
  "perplexity": { id: "perplexity", type: "search", name: "Perplexity 搜", icon: "🔍", badge: "Perplexity 深度检索" },
  "llm_chat": { id: "llm_chat", type: "tool", name: "多渠道对话 Box", icon: "💬", badge: "无感 Fallback 对话" },
  "channel_status": { id: "channel_status", type: "tool", name: "中转站路由中心", icon: "📡", badge: "白嫖 API 路由监控" },
  "memo_note": { id: "memo_note", type: "tool", name: "AI 灵感便签", icon: "📝", badge: " Markdown 随手记" }
};

let activeWidgets = JSON.parse(localStorage.getItem('spatial_widgets_state_v3') || '[]');
let widgetPositions = JSON.parse(localStorage.getItem('spatial_widgets_pos_v3') || '{}');

let canvasPanX = 40, canvasPanY = 90, canvasZoomScale = 1.0;
let isPanning = false, startPanX = 0, startPanY = 0;
let channelCache = {};

/* ---------- 拖拽 Dock 抽屉 ---------- */
function toggleDock() {
  const dock = document.getElementById('left-dock');
  const btn = dock.querySelector('.dock-toggle-btn');
  dock.classList.toggle('collapsed');
  btn.innerText = dock.classList.contains('collapsed') ? '▶' : '◀';
}

/* ---------- 复制中转 API ---------- */
function copyEndpoint() {
  navigator.clipboard.writeText('http://' + location.host + '/v1');
  alert('✅ 统一中转站 API 地址已复制到剪贴板:\nhttp://' + location.host + '/v1');
}

/* ---------- Canvas 平移与缩放 (支持触控板轻扫、滚轮平移、按住拖拽、抓手模式、空格拖拽) ---------- */
let isHandMode = false;
let isSpacePressed = false;

window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && !['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
    isSpacePressed = true;
    const vp = document.getElementById('canvas-viewport');
    if (vp) vp.style.cursor = 'grab';
  }
});

window.addEventListener('keyup', (e) => {
  if (e.code === 'Space') {
    isSpacePressed = false;
    const vp = document.getElementById('canvas-viewport');
    if (vp) vp.style.cursor = isHandMode ? 'grab' : 'default';
  }
});

function toggleHandMode() {
  isHandMode = !isHandMode;
  const btn = document.getElementById('hand-mode-btn');
  const vp = document.getElementById('canvas-viewport');
  if (btn) {
    btn.style.background = isHandMode ? 'var(--primary)' : '#f1f5f9';
    btn.style.color = isHandMode ? '#fff' : 'var(--text-main)';
  }
  if (vp) vp.style.cursor = isHandMode ? 'grab' : 'default';
}

function updateCanvasTransform() {
  const canvas = document.getElementById('spatial-canvas');
  const viewport = document.getElementById('canvas-viewport');
  const badge = document.getElementById('zoom-badge');
  if (canvas) {
    canvas.style.transform = `translate(${canvasPanX}px, ${canvasPanY}px) scale(${canvasZoomScale})`;
  }
  if (viewport) {
    const gridGradSize = 28 * canvasZoomScale;
    viewport.style.backgroundSize = `${gridGradSize}px ${gridGradSize}px`;
    viewport.style.backgroundPosition = `${canvasPanX}px ${canvasPanY}px`;
  }
  if (badge) badge.innerText = `${Math.round(canvasZoomScale * 100)}%`;
}


function zoomCanvas(delta) {
  canvasZoomScale = Math.min(Math.max(0.2, canvasZoomScale + delta), 2.5);
  updateCanvasTransform();
}

function resetCanvasTransform() {
  canvasPanX = 40;
  canvasPanY = 90;
  canvasZoomScale = 1.0;
  updateCanvasTransform();
}

function handleCanvasWheel(ev) {
  ev.preventDefault();

  // 若按住 Ctrl 键或 Pinch 缩放手势 -> 缩放视角
  if (ev.ctrlKey || ev.metaKey) {
    const zoomFactor = ev.deltaY < 0 ? 1.06 : 0.94;
    const newScale = Math.min(Math.max(0.2, canvasZoomScale * zoomFactor), 2.5);
    
    const viewport = document.getElementById('canvas-viewport');
    const rect = viewport ? viewport.getBoundingClientRect() : { left: 0, top: 0 };
    const mouseX = ev.clientX - rect.left;
    const mouseY = ev.clientY - rect.top;

    canvasPanX = mouseX - (mouseX - canvasPanX) * (newScale / canvasZoomScale);
    canvasPanY = mouseY - (mouseY - canvasPanY) * (newScale / canvasZoomScale);
    canvasZoomScale = newScale;
  } else {
    // 正常滚轮 / 触控板轻扫 -> 顺滑 2D 平移 (上下左右 X/Y 双向)
    canvasPanX -= ev.deltaX;
    canvasPanY -= ev.deltaY;
  }
  
  updateCanvasTransform();
}

function handleCanvasMouseDown(ev) {
  // 点击空白背景、或者处于 Hand 抓手模式/按住 Space 键时触发平移
  const isWidgetClick = ev.target.closest('.spatial-widget');
  if (isWidgetClick && !isSpacePressed && !isHandMode) return;

  isPanning = true;
  startPanX = ev.clientX - canvasPanX;
  startPanY = ev.clientY - canvasPanY;

  const viewport = document.getElementById('canvas-viewport');
  if (viewport) viewport.style.cursor = 'grabbing';

  function onMouseMove(e) {
    if (!isPanning) return;
    canvasPanX = e.clientX - startPanX;
    canvasPanY = e.clientY - startPanY;
    updateCanvasTransform();
  }

  function onMouseUp() {
    isPanning = false;
    if (viewport) viewport.style.cursor = (isHandMode || isSpacePressed) ? 'grab' : 'default';
    window.removeEventListener('mousemove', onMouseMove);
    window.removeEventListener('mouseup', onMouseUp);
  }

  window.addEventListener('mousemove', onMouseMove);
  window.addEventListener('mouseup', onMouseUp);
}


/* ---------- 渲染组件库 ---------- */
function renderWidgetLibrary() {
  const library = document.getElementById('widget-library');
  if (!library) return;
  library.innerHTML = '';

  Object.values(AVAILABLE_WIDGET_TYPES).forEach(item => {
    const isAdded = activeWidgets.includes(item.id);
    const card = document.createElement('div');
    card.className = 'library-card';
    card.draggable = true;
    card.ondragstart = (e) => handleLibraryDragStart(e, item.id);
    
    card.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <span style="font-weight:800;font-size:14px;color:#000;">${item.icon} ${item.name}</span>
        <button type="button" class="btn" onclick="addWidgetToCanvas('${item.id}')" 
                style="font-size:11px;padding:3px 10px;${isAdded ? 'background:#e2e8f0;color:#94a3b8;cursor:default;' : 'background:var(--primary);color:#fff;'}" 
                ${isAdded ? 'disabled' : ''}>${isAdded ? '已在画布' : '+ 放置'}</button>
      </div>
      <span style="font-size:11px;color:var(--text-muted);">${item.badge}</span>
    `;
    library.appendChild(card);
  });
}

/* ---------- 渲染 Spatial Canvas 上的所有 Widget 卡片 ---------- */
function renderCanvasWidgets() {
  const canvas = document.getElementById('spatial-canvas');
  if (!canvas) return;
  canvas.innerHTML = '';

  if (activeWidgets.length === 0) {
    activeWidgets = ["yuanbao", "doubao", "kimi", "channel_status"];
    saveWidgetState();
  }

  activeWidgets.forEach((id, idx) => {
    const info = AVAILABLE_WIDGET_TYPES[id] || { id, name: id, icon: "🧩", badge: "组件" };
    const pos = widgetPositions[id] || {
      x: 30 + (idx % 3) * 440,
      y: 30 + Math.floor(idx / 3) * 420,
      w: id === 'channel_status' ? 840 : 410,
      h: id === 'channel_status' ? 380 : 390
    };

    const widget = document.createElement('div');
    widget.className = 'spatial-widget';
    widget.dataset.id = id;
    widget.style.cssText = `left:${pos.x}px;top:${pos.y}px;width:${pos.w}px;height:${pos.h}px;`;

    let bodyHTML = '';
    if (info.type === 'search') {
      bodyHTML = `<div class="node-body" id="body-${id}">等待发起搜索…</div>`;
    } else if (id === 'llm_chat') {
      bodyHTML = `
        <div style="display:flex;flex-direction:column;gap:10px;height:100%;">
          <div style="display:flex;gap:8px;">
            <select id="chat-ch-sel" onchange="loadChannelModels()" style="flex:1;padding:8px;border:1.5px solid var(--hairline);border-radius:8px;font-size:13px;font-weight:600;"></select>
            <select id="chat-md-sel" style="flex:1.2;padding:8px;border:1.5px solid var(--hairline);border-radius:8px;font-size:13px;font-weight:600;"></select>
          </div>
          <textarea id="chat-input" placeholder="输入提示词对话…" style="height:70px;padding:8px;border:1.5px solid var(--hairline);border-radius:8px;font-size:13px;font-weight:600;resize:none;">你好，用一句话介绍你自己</textarea>
          <button type="button" class="btn" onclick="sendLlmChat()" style="padding:8px 16px;font-size:13px;">发送对话</button>
          <div id="chat-reply" style="flex:1;background:var(--bg-canvas);border-radius:8px;padding:10px;font-size:13px;overflow-y:auto;white-space:pre-wrap;font-family:monospace;">等待发送…</div>
        </div>
      `;
    } else if (id === 'channel_status') {
      bodyHTML = `
        <div style="display:flex;flex-direction:column;gap:10px;height:100%;overflow:hidden;">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <span style="font-size:13px;font-weight:700;">📡 聚合中转路由监控</span>
            <button type="button" class="btn btn-secondary" onclick="refreshChannels()" style="padding:4px 10px;font-size:12px;">🔄 刷新状态</button>
          </div>
          <div style="flex:1;overflow-y:auto;">
            <table style="width:100%;border-collapse:collapse;font-size:13px;">
              <thead>
                <tr style="background:var(--bg-canvas);border-bottom:1.5px solid var(--hairline);">
                  <th style="padding:8px;text-align:left;">渠道与来源</th>
                  <th style="padding:8px;text-align:left;">类型</th>
                  <th style="padding:8px;text-align:left;">状态</th>
                  <th style="padding:8px;text-align:left;">可用模型</th>
                </tr>
              </thead>
              <tbody id="ch-tbody-canvas"></tbody>
            </table>
          </div>
        </div>
      `;
    } else if (id === 'memo_note') {
      bodyHTML = `
        <textarea style="width:100%;height:100%;border:none;outline:none;resize:none;font-size:14px;line-height:1.7;font-family:inherit;background:transparent;" 
                  placeholder="✍️ 随意记录您的 AI 灵感便签与思考…"></textarea>
      `;
    }

    widget.innerHTML = `
      <div class="widget-head" onmousedown="initWidgetDrag(event, '${id}')">
        <div class="widget-title">${info.icon} ${info.name} <span class="widget-badge">${info.badge}</span></div>
        <div class="widget-actions">
          <button type="button" class="icon-btn" onclick="removeWidgetFromCanvas('${id}')" title="移除组件">✕</button>
        </div>
      </div>
      <div class="widget-body">${bodyHTML}</div>
      <div class="widget-foot">
        <span id="status-${id}">就绪</span>
        <span>↘ 拖拽右下角改变形状大小</span>
      </div>
    `;

    if (window.ResizeObserver) {
      const ro = new ResizeObserver(entries => {
        for (let entry of entries) {
          const w = Math.round(entry.contentRect.width);
          const h = Math.round(entry.contentRect.height);
          if (widgetPositions[id]) {
            widgetPositions[id].w = w;
            widgetPositions[id].h = h;
            saveWidgetPositions();
          }
        }
      });
      ro.observe(widget);
    }

    canvas.appendChild(widget);
  });

  renderWidgetLibrary();
  updateCanvasTransform();
  refreshChannels();
}

/* ---------- 拖拽组件 Card ---------- */
function initWidgetDrag(ev, id) {
  ev.stopPropagation();
  const widget = document.querySelector(`.spatial-widget[data-id="${id}"]`);
  if (!widget) return;

  document.querySelectorAll('.spatial-widget').forEach(w => w.classList.remove('active-widget'));
  widget.classList.add('active-widget');

  const startX = ev.clientX;
  const startY = ev.clientY;
  const initialLeft = widget.offsetLeft;
  const initialTop = widget.offsetTop;

  function onMouseMove(e) {
    const dx = (e.clientX - startX) / canvasZoomScale;
    const dy = (e.clientY - startY) / canvasZoomScale;
    const newLeft = initialLeft + dx;
    const newTop = initialTop + dy;
    widget.style.left = `${newLeft}px`;
    widget.style.top = `${newTop}px`;
    
    if (!widgetPositions[id]) widgetPositions[id] = { w: 410, h: 390 };
    widgetPositions[id].x = Math.round(newLeft);
    widgetPositions[id].y = Math.round(newTop);
  }


  function onMouseUp() {
    saveWidgetPositions();
    window.removeEventListener('mousemove', onMouseMove);
    window.removeEventListener('mouseup', onMouseUp);
  }

  window.addEventListener('mousemove', onMouseMove);
  window.addEventListener('mouseup', onMouseUp);
}

function handleLibraryDragStart(ev, widgetId) {
  ev.dataTransfer.setData('text/plain', widgetId);
}

function handleCanvasDragOver(ev) {
  ev.preventDefault();
}

function handleCanvasDrop(ev) {
  ev.preventDefault();
  const id = ev.dataTransfer.getData('text/plain');
  if (id && AVAILABLE_WIDGET_TYPES[id]) {
    addWidgetToCanvas(id);
  }
}

function addWidgetToCanvas(id) {
  if (!activeWidgets.includes(id)) {
    activeWidgets.push(id);
    saveWidgetState();
    renderCanvasWidgets();
  }
}

function removeWidgetFromCanvas(id) {
  activeWidgets = activeWidgets.filter(item => item !== id);
  saveWidgetState();
  renderCanvasWidgets();
}

function clearAllCanvasWidgets() {
  if (confirm('确定要清空画布上的所有组件吗？')) {
    activeWidgets = [];
    saveWidgetState();
    renderCanvasWidgets();
  }
}

function autoAlignWidgets() {
  activeWidgets.forEach((id, idx) => {
    widgetPositions[id] = {
      x: 30 + (idx % 3) * 440,
      y: 30 + Math.floor(idx / 3) * 420,
      w: widgetPositions[id] ? widgetPositions[id].w : (id === 'channel_status' ? 840 : 410),
      h: widgetPositions[id] ? widgetPositions[id].h : (id === 'channel_status' ? 380 : 390)
    };
  });
  saveWidgetPositions();
  resetCanvasTransform();
  renderCanvasWidgets();
}

function saveWidgetState() {
  localStorage.setItem('spatial_widgets_state_v3', JSON.stringify(activeWidgets));
}

function saveWidgetPositions() {
  localStorage.setItem('spatial_widgets_pos_v3', JSON.stringify(widgetPositions));
}

/* ==========================================================================
   搜索与渠道业务交互逻辑
   ========================================================================== */

function triggerGlobalCanvasSearch() {
  const input = document.getElementById('global-prompt-input');
  const prompt = input ? input.value.trim() : '';
  if (!prompt) {
    alert('请输入搜索问题');
    return;
  }

  const searchEngineIds = activeWidgets.filter(id => AVAILABLE_WIDGET_TYPES[id] && AVAILABLE_WIDGET_TYPES[id].type === 'search');
  if (searchEngineIds.length === 0) {
    alert('画布中暂无 AI 搜索引擎组件！请先从左侧【功能组件库】放置至少一个 AI 搜索组件。');
    return;
  }

  searchEngineIds.forEach(id => {
    const eng = AVAILABLE_WIDGET_TYPES[id];
    const body = document.getElementById('body-' + id);
    const status = document.getElementById('status-' + id);
    if (body) body.innerHTML = `正在连接 ${eng.name}…<span class="cursor-blink"></span>`;
    if (status) status.innerText = '检索中…';
  });

  const currentResults = {};
  const enginesParam = encodeURIComponent(searchEngineIds.join(','));
  const es = new EventSource('/api/unified_stream?prompt=' + encodeURIComponent(prompt) + '&engines=' + enginesParam);

  es.onmessage = ev => {
    if (ev.data === '[DONE]') {
      es.close();
      searchEngineIds.forEach(id => {
        const b = document.getElementById('body-' + id);
        const c = b ? b.querySelector('.cursor-blink') : null;
        if (c) c.remove();
      });
      saveSearchHistory(prompt, currentResults);
      return;
    }
    try {
      const d = JSON.parse(ev.data);
      if (d.id && searchEngineIds.includes(d.id)) {
        const b = document.getElementById('body-' + d.id);
        const s = document.getElementById('status-' + d.id);
        if (d.status === 'progress' && b) {
          b.innerText = d.msg;
        } else if (d.status === 'done' && b) {
          const answerText = d.answer || d.text || '';
          b.innerHTML = renderResultHTML(d.thinking, answerText, d.answer_html || '');
          currentResults[d.id] = { answer: answerText, html: b.innerHTML };
          if (s) s.innerText = d.refs ? `完成 · 引用 ${d.refs} 条` : '完成';
        }
      }
    } catch(e){}
  };
  es.onerror = () => es.close();
}

function renderResultHTML(thinking, answer, answerHTML) {
  let html = '';
  if (thinking) {
    html += `<details style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:8px 12px;margin-bottom:10px;">` +
      `<summary style="font-size:12px;font-weight:700;color:var(--text-muted);cursor:pointer;">💡 展开思考过程</summary>` +
      `<div style="font-size:13px;color:#475569;margin-top:6px;white-space:pre-wrap;">${thinking}</div></details>`;
  }
  if (answerHTML) {
    html += answerHTML;
  } else if (window.marked) {
    html += marked.parse(answer || '');
  } else {
    html += answer || '';
  }
  return html;
}

/* ---------- 渠道数据获取 ---------- */
async function refreshChannels() {
  try {
    const d = await (await fetch('/api/channels')).json();
    channelCache = d.channels || {};
    
    // 渲染 LLM 渠道下拉
    const csel = document.getElementById('chat-ch-sel');
    if (csel) {
      csel.innerHTML = '';
      Object.entries(channelCache).forEach(([id, ch]) => {
        const ok = ch.key_set && ch.reachable;
        csel.innerHTML += `<option value="${id}">${ok ? '✓ ' : ''}${ch.name}${ok ? '' : '（待配置）'}</option>`;
      });
      loadChannelModels();
    }

    // 渲染渠道监控表格
    const tbody = document.getElementById('ch-tbody-canvas');
    if (tbody) {
      tbody.innerHTML = '';
      Object.entries(channelCache).forEach(([id, ch]) => {
        const ok = ch.key_set && ch.reachable;
        const statusBadge = ok ? '<span style="color:var(--green);font-weight:700;">已连接</span>' : '<span style="color:var(--amber);font-weight:700;">待配置</span>';
        const models = (ch.models && ch.models.length) ? ch.models.join(', ') : '—';
        tbody.innerHTML += `
          <tr style="border-bottom:1px solid var(--card-border);">
            <td style="padding:8px;font-weight:700;">${ch.icon || '🔗'} ${ch.name}</td>
            <td style="padding:8px;font-size:12px;">${ch.billing_tag || '免费'}</td>
            <td style="padding:8px;">${statusBadge}</td>
            <td style="padding:8px;font-size:12px;font-family:monospace;">${models}</td>
          </tr>
        `;
      });
    }
  } catch(e){}
}

function loadChannelModels() {
  const csel = document.getElementById('chat-ch-sel');
  const msel = document.getElementById('chat-md-sel');
  if (!csel || !msel) return;
  const ch = channelCache[csel.value];
  if (!ch) return;
  msel.innerHTML = '';
  const models = (ch.models && ch.models.length) ? ch.models : [ch.default_model || '—'];
  models.forEach(m => msel.innerHTML += `<option value="${m}">${m}</option>`);
}

function sendLlmChat() {
  const msel = document.getElementById('chat-md-sel');
  const prompt = document.getElementById('chat-input').value;
  const reply = document.getElementById('chat-reply');
  if (!msel || !reply) return;

  const model = msel.value;
  reply.innerText = '请求 ' + model + ' 中…';
  const es = new EventSource('/v1/sse?model=' + encodeURIComponent(model) + '&prompt=' + encodeURIComponent(prompt));
  let buf = '';
  es.onmessage = ev => {
    if (ev.data === '[DONE]') { es.close(); return; }
    try {
      const o = JSON.parse(ev.data);
      const c = o.choices[0].delta.content;
      if (c) { buf += c; reply.innerText = buf; }
    } catch(e){}
  };
  es.onerror = () => { es.close(); if(!buf) reply.innerText = '请求失败：渠道未就绪'; };
}

/* ---------- 历史记录 Modal ---------- */
function openHistoryModal() {
  document.getElementById('history-modal').style.display = 'flex';
  renderModalHistoryList();
}
function closeHistoryModal() {
  document.getElementById('history-modal').style.display = 'none';
}
function saveSearchHistory(query, resultsData) {
  if (!query || !query.trim()) return;
  let list = JSON.parse(localStorage.getItem('ai_search_history_v1') || '[]');
  list.unshift({ query: query.trim(), time_str: new Date().toLocaleTimeString(), results: resultsData });
  if (list.length > 20) list = list.slice(0, 20);
  localStorage.setItem('ai_search_history_v1', JSON.stringify(list));
}
async function renderModalHistoryList() {
  const listEl = document.getElementById('modal-history-list');
  if (!listEl) return;
  listEl.innerHTML = '<div style="color:var(--text-muted);font-size:13px;">加载中…</div>';
  let list = JSON.parse(localStorage.getItem('ai_search_history_v1') || '[]');
  try {
    const res = await fetch('/api/history');
    if (res.ok) {
      const data = await res.json();
      if (data && data.history) list = data.history;
    }
  } catch(e){}

  listEl.innerHTML = '';
  if (list.length === 0) {
    listEl.innerHTML = '<div style="color:var(--text-muted);font-size:13px;">暂无历史记录</div>';
    return;
  }
  list.forEach(item => {
    const div = document.createElement('div');
    div.style.cssText = 'background:#fff;border:1px solid var(--card-border);border-radius:8px;padding:10px;cursor:pointer;';
    div.innerHTML = `<div style="font-weight:700;font-size:14px;margin-bottom:4px;">🔍 ${item.query || item.question}</div><div style="font-size:11px;color:var(--text-muted);">时间: ${item.time_str || (item.created_at || '').slice(11,16)}</div>`;
    div.onclick = () => {
      document.getElementById('modal-history-detail').innerHTML = `<div style="font-weight:800;font-size:16px;margin-bottom:12px;">🔍 ${item.query || item.question}</div>` +
        `<div style="font-size:14px;line-height:1.7;">${JSON.stringify(item.results || {}, null, 2)}</div>`;
    };
    listEl.appendChild(div);
  });
}

window.onload = () => {
  renderCanvasWidgets();
  updateCanvasTransform();
};
