<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>组件编排器 —— AI 画布观察窗 UI</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- 1. 阶段时间线 Header -->
<header class="top-header">
  <div class="brand-title">
    🎬 课件编排器 <span>AI 自治观察窗</span>
  </div>

  <div class="timeline-stepper" id="timeline-stepper">
    <div class="step-item active" id="step-framework"><div class="step-dot"></div>1. 框架生成</div>
    <div class="step-item" id="step-scan"><div class="step-dot"></div>2. 槽位扫描</div>
    <div class="step-item" id="step-asset_fill"><div class="step-dot"></div>3. 资产填充</div>
    <div class="step-item" id="step-verify"><div class="step-dot"></div>4. 规则校验</div>
    <div class="step-item" id="step-deliver"><div class="step-dot"></div>5. 交付完工</div>
  </div>
</header>

<!-- 2. 主体槽位卡片网格区 -->
<main class="canvas-body" id="slot-grid">
  <!-- 动态挂载媒体槽位状态卡片与预览截图墙 -->
</main>

<!-- 3. 右侧 SSE 事件流日志面板 -->
<aside class="sidebar-logs">
  <div class="log-title">
    <span>📡 编排器 SSE 事件流</span>
    <span style="font-size:11px;color:var(--text-muted);font-weight:600;" id="event-count">0 条事件</span>
  </div>
  <div class="log-stream" id="log-stream"></div>
</aside>

<!-- 4. 底部 L2 确认控制条 -->
<footer class="bottom-bar">
  <div style="display:flex;align-items:center;gap:14px;">
    <span style="font-size:13px;font-weight:700;">进度: <b id="progress-text" style="color:var(--primary);">0/0</b></span>
    <span style="font-size:12px;color:var(--text-muted);">已用时间: <b id="timer-text" style="color:var(--text-main);">00:00</b></span>
  </div>

  <div style="display:flex;align-items:center;gap:10px;">
    <button type="button" class="btn" id="confirm-btn" onclick="sendConfirmAction()">✓ L2 关键节点确认继续</button>
  </div>
</footer>

<script src="mock_events.js"></script>
<script src="app.js"></script>
</body>
</html>
