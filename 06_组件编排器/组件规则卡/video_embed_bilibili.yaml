component: video_embed
site: B站（哔哩哔哩）
session: bilibili           # 可不登录（公开视频），登录后可访问更多
url: https://www.bilibili.com/
mode: embed                 # 固定链接嵌入，不下载
search:
  method: search_page       # B站搜索页检索，或借助 AI 搜索引擎选型
  search_url_tpl: "https://search.bilibili.com/all?keyword={keyword}"
  result_selector: "a[href*=BV]"
extract:
  bv_pattern: "BV[0-9A-Za-z]{10}"
  validate: "https://www.bilibili.com/video/{bv}"   # 校验视频存在且可嵌入
embed_tpl: |
  <div class="video-slot" style="position:relative;width:100%;aspect-ratio:16/9;">
    <iframe src="//player.bilibili.com/player.html?bvid={bv}&page=1&high_quality=1&danmaku=0&autoplay=0"
            scrolling="no" border="0" frameborder="no" framespacing="0" allowfullscreen="true"
            style="position:absolute;inset:0;width:100%;height:100%;"></iframe>
  </div>
fallback:
  - 换关键词重试
  - 画布标红，用户裁决（替换或跳过）
budget:
  max_retry: 2
notes: autoplay 固定为 0；部分视频禁止站外播放，遇此情况换下一个候选。
