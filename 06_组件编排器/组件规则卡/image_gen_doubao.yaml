component: image_gen
site: 豆包生图
session: doubao_image
url: https://www.doubao.com/chat/create-image
style_lock: "flat cartoon, 儿童教材插画风, 明亮色调"
status: "✅ 已实测 — 2026-08-09 OpenCode：Seedream 模型全链路出图验证，真实样例 doubao_verified.png (580x580)"
inject:
  fill_selector: ".tiptap.ProseMirror, [contenteditable=true], [role=textbox]"
  fill_nth: 0
  input_method: type        # 豆包是 React 受控输入，须真实键入（参考引擎适配经验）
  submit: "keys:Enter"
wait:
  timeout_s: 90
  poll_js: "!!document.querySelector('img[src*=imagex], img[class*=result], img[class*=image]')"
extract:
  method: img_src           # imagex.byteimg.com 直链稳定
  selector: "img[src*=imagex], img[class*=result], img[class*=image]"
  prefer_last: true         # 取最新一张
fallback:
  - 换提示词重试（去敏感词）
  - 换备用站点（chatgpt_mirror / qianwen）
budget:
  max_retry: 2
notes: 2026-08-09 实测修正：输入区为 .tiptap.ProseMirror（contenteditable），非 textarea；模型 Seedream；生成图 580x580 imagex 直链，可稳定提取。
