component: image_gen
site: Gemini 官方生图
session: gemini_image
url: https://gemini.google.com/app
style_lock: "flat cartoon, 线条手绘插画风, 干净简约"
status: "✅ 实锤入库 — 2026-08-09 OpenCode 复核修正：3.6 Flash 直接输入绘图提示词即可自动调起 Imagen 生图，无需额外激活 Images 工具。产出样例 gemini_official_pro.png"
inject:
  pre_actions:
    - action: click_model_picker
      selector: "button[aria-label*='mode picker' i], .input-area-switch"
    - action: select_model
      selector: "gem-menu-item:has-text('3.6 Flash')"
  fill_selector: "rich-textarea, [contenteditable='true'], p"
  input_method: shadow_p_inject
  submit: "click:button[aria-label*='Send' i]"
wait:
  timeout_s: 90
  poll_js: "!!document.querySelector('generated-image img[alt*=\"AI generated\"], img[src^=\"blob:\"][alt*=\"AI generated\"]')"
extract:
  method: blob_screenshot
  selector: "generated-image img[alt*='AI generated'], single-image img[alt*='AI generated']"
  prefer_last: true
fallback:
  - 切换 3.6 Flash / 3.1 Pro 模型重试
  - 换备用站点（doubao / zhipu）
budget:
  max_retry: 2
notes: 支持 3.6 Flash 模型下自动化，穿透 Shadow DOM 在 rich-textarea 注入提示词并点击 Send 提交。Flash 模型接收绘图提示词后自动调起 Imagen 生图，DOM 中产生 `<generated-image>` 元素含 blob: 图片。提取方法需处理 blob URL（截图或 canvas 提取）。
